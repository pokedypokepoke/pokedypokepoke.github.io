<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tokyo Monster Maker – King of Tokyo custom characters</title>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Nunito:wght@600;800&family=Bangers&family=Bungee&family=Chewy&family=Creepster&family=Permanent+Marker&family=Pacifico&family=Bubblegum+Sans&family=Rubik+Mono+One&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--sky1:#07152f;--sky2:#123f78;--sky3:#0b2b52;--ink:#102a43;--glass1:rgba(255,255,255,.94);--glass2:rgba(255,255,255,.82);--edge:rgba(255,255,255,.9);--green:#59c21e;--green2:#2c8a0f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Keep interface surfaces readable regardless of the operating-system theme. */
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;font:500 15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--ink);background:linear-gradient(145deg,#061329 0%,#0b2b55 48%,#174b83 100%);background-color:#0b2b55;background-attachment:fixed;overflow-x:hidden}
body::before{display:none;content:none}
#app{position:relative;max-width:1180px;margin:0 auto;padding:22px 18px 60px}
.glass{background:linear-gradient(180deg,var(--glass1),var(--glass2) 52%,rgba(255,255,255,.3));border:1px solid var(--edge);border-radius:20px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 10px 30px rgba(0,50,90,.25),inset 0 1px 0 #fff}
h1,.kot{font-family:'Luckiest Guy',Impact,sans-serif;font-weight:400;letter-spacing:.02em}\nh2{font-family:Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;font-weight:750;letter-spacing:-.02em}
h1{font-size:clamp(34px,6vw,60px);margin:6px 0 0;color:#fff;-webkit-text-stroke:.14em #0a4a78;paint-order:stroke fill;text-shadow:0 6px 0 rgba(0,40,80,.25)}
.sub{margin:10px 0 22px;font-size:16px;max-width:820px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.55)}
h2{font-size:22px;margin:0 0 10px;color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.cgrid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.box{cursor:pointer;padding:10px;transition:transform .15s}
.box:hover,.box:focus-visible{transform:translateY(-4px)}
.box .bar{display:flex;justify-content:space-between;padding:10px 4px 2px;gap:8px}
.box .bar span{opacity:.75;font-size:13px;white-space:nowrap}
.new{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:210px;border:2px dashed rgba(255,255,255,.9);text-align:center;gap:6px}
.cgrid .new{min-height:250px}
.new i{font:normal 800 56px/1 Nunito;color:#fff;text-shadow:0 2px 6px rgba(0,60,100,.5)}
.new b{font-size:17px}
button,.btn{font:650 14px Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink);cursor:pointer;border:1px solid var(--edge);border-radius:999px;padding:8px 16px;background:linear-gradient(180deg,#fff,rgba(255,255,255,.45) 50%,rgba(190,225,245,.7));box-shadow:0 2px 6px rgba(0,50,90,.25),inset 0 1px 0 #fff;display:inline-block}
button:hover,.btn:hover{filter:brightness(1.06)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,.box:focus-visible{outline:3px solid #ffe14d;outline-offset:2px}
.go{color:#fff;background:linear-gradient(180deg,#9be85a,var(--green) 50%,var(--green2));border-color:#d6ffb0;text-shadow:0 1px 2px rgba(0,60,0,.6)}
.danger{color:#a01212}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.top input{flex:1;min-width:160px;font:400 26px 'Luckiest Guy',sans-serif}
.blades{display:flex;gap:6px;margin-bottom:-1px;overflow-x:auto;padding-top:4px}
.blade{border-radius:16px 16px 0 0;padding:11px 22px;font-size:15px;border-bottom:0;white-space:nowrap}
.blade.on{color:#fff;background:linear-gradient(180deg,#a6f063,var(--green) 55%,var(--green2));text-shadow:0 1px 2px rgba(0,60,0,.6)}
.panel{padding:20px;border-top-left-radius:0}
.split{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:22px;align-items:start}
@media(max-width:820px){.split{grid-template-columns:1fr}}
.ctl{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px}
input[type=text],textarea,select{font:500 15px Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;color:#102a43;padding:9px 12px;border-radius:12px;border:1px solid var(--edge);background:rgba(255,255,255,.7);box-shadow:inset 0 2px 5px rgba(0,60,100,.18);width:100%}
select option{color:#102a43;background:#fff}\ninput[type=color]{width:46px;height:36px;padding:0;border:2px solid #fff;border-radius:50%;cursor:pointer;background:none}
input[type=range]{width:100%;accent-color:var(--green)}
.sw{width:26px;height:26px;padding:0;border-radius:50%}
.chip{padding:6px 12px}.chip.on{color:#fff;background:linear-gradient(180deg,#a6f063,var(--green2))}
.pill{display:inline-block;padding:6px 14px;border-radius:999px;font:800 13px Nunito,sans-serif;color:#fff;background:linear-gradient(180deg,#9be85a,var(--green) 55%,var(--green2));border:1px solid #d6ffb0;text-shadow:0 1px 2px rgba(0,60,0,.5)}
.pill.gray{background:linear-gradient(180deg,#fff,#cfe6f5);color:var(--ink);border-color:var(--edge);text-shadow:none}
.sp{padding:14px;margin-bottom:6px}
.note{font-size:13px;opacity:.8}
#saved{position:fixed;top:10px;right:12px;z-index:9;padding:5px 14px;font-size:12px;border-radius:999px}
.stage{position:relative;overflow:hidden;container-type:inline-size;border-radius:14px;box-shadow:0 8px 24px rgba(0,40,80,.35);touch-action:none;background:#0a2a44;user-select:none}
.c16{width:100%;aspect-ratio:16/10;cursor:grab}
.cfig{width:62%;margin:0 auto;aspect-ratio:3/4;cursor:grab}
.chk{background:conic-gradient(#cfd8e3 25%,#fff 0 50%,#cfd8e3 0 75%,#fff 0) 0 0/16px 16px}
.stage img{position:absolute;max-width:none;pointer-events:none}
.ph{position:absolute;inset:0;display:grid;place-items:center;color:#9cc;font-size:14px;text-align:center;padding:8px}
.tx{position:absolute;font-family:'Luckiest Guy',Impact,sans-serif;line-height:1;white-space:nowrap;-webkit-text-stroke:.22em #000;paint-order:stroke fill;stroke-linejoin:round;cursor:move;z-index:1}
.tx.sel{outline:.12em dashed #fff;outline-offset:.2em}
.rot{position:absolute;left:50%;top:-5.5cqw;width:3.6cqw;height:3.6cqw;margin-left:-1.8cqw;border-radius:50%;background:#ffe14d;border:.5cqw solid #222;cursor:grab;-webkit-text-stroke:0}
.rot::after{content:"";position:absolute;left:50%;top:100%;width:.4cqw;height:2cqw;margin-left:-.2cqw;background:#fff}
.hw{position:absolute;top:2.5cqw;display:flex;align-items:center;gap:1.2cqw;padding:1cqw 1.4cqw;border-radius:2.2cqw;background:rgba(255,255,255,.9);border:.6cqw solid #1b4f8a;box-shadow:0 .6cqw 1.4cqw rgba(0,0,0,.4);z-index:2;pointer-events:none}
.hwl{left:2.5cqw}.hwr{right:2.5cqw;top:auto;bottom:2.5cqw}
.hi{width:6.5cqw;height:6.5cqw}
.hole{display:block;width:12cqw;height:7.5cqw;border:.5cqw dashed #222;border-radius:1.2cqw;background:rgba(0,0,0,.55)}
.stand{width:78%;height:16px;margin:-6px auto 0;border-radius:50%;background:radial-gradient(#345,#123);box-shadow:0 6px 12px rgba(0,0,0,.3)}
.evlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px;margin:12px 0 18px}
.evlist .th{cursor:pointer;border-radius:12px;padding:3px;border:2px solid transparent}
.evlist .th.on{border-color:#ffe14d}
.evlist .evo{pointer-events:none}
.evw{container-type:inline-size}
.evo{container-type:inline-size;position:relative;aspect-ratio:1;border-radius:9cqw;overflow:hidden;box-shadow:0 8px 22px rgba(0,40,80,.4);border:1.2cqw solid rgba(0,0,0,.35);background-color:var(--bg);background-blend-mode:overlay;font-family:Nunito,sans-serif}
.otx{font-family:'Luckiest Guy',Impact,sans-serif;font-weight:400;color:#fff;-webkit-text-stroke:.24em var(--ol);paint-order:stroke fill;line-height:1}
.ban{position:absolute;left:9cqw;right:7cqw;top:4.5cqw;height:12cqw;border-radius:3cqw;background:linear-gradient(180deg,#3a2414,#1a0f08);border:.8cqw solid #e0a04a;display:flex;align-items:center;justify-content:center;padding-left:9cqw}
.ban.nob{padding-left:0;left:7cqw}
.cn{white-space:nowrap}
.med{position:absolute;left:-5cqw;top:-3cqw;width:16cqw;height:16cqw;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff7a6a,#d01515 60%,#8a0808);border:1cqw solid #fff;display:grid;place-items:center;font-size:8.5cqw;color:#fff;box-shadow:0 1cqw 2cqw rgba(0,0,0,.4)}
.pan{position:absolute;left:6cqw;right:6cqw;top:19cqw;bottom:6cqw;border-radius:6cqw;background:rgba(255,255,255,.9);box-shadow:inset 0 0 0 1cqw rgba(255,255,255,.7);display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;padding:2cqw 5cqw;text-align:center}
.lab{font-size:6.2cqw;white-space:nowrap}.lab .y{color:#ffd400;-webkit-text-stroke:.24em #000}.lab .w{color:#2a2a2a;-webkit-text-stroke:0;font-family:Nunito;font-weight:800;letter-spacing:.06em}
.ttl{transform:rotate(-3deg);padding:0 2cqw;word-break:break-word}
.ds{color:#2b2b2b;font-weight:800;white-space:pre-wrap}
.ic{display:inline-block;width:1.15em;height:1.15em;vertical-align:-.22em}
.metal{background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.2) 0 1px,rgba(0,0,0,.14) 1px 3px),linear-gradient(115deg,rgba(255,255,255,.7),rgba(0,0,0,.4) 40%,rgba(255,255,255,.6) 62%,rgba(0,0,0,.35))}
.ocean{background-image:repeating-radial-gradient(circle at 50% 130%,rgba(255,255,255,.6) 0 3%,rgba(0,0,0,.3) 3% 8%),linear-gradient(180deg,rgba(255,255,255,.6),rgba(0,0,0,.2))}
.fire{background-image:repeating-conic-gradient(from 0deg at 50% 115%,rgba(255,255,255,.7) 0 7deg,rgba(0,0,0,.35) 7deg 14deg),linear-gradient(0deg,rgba(255,255,255,.6),rgba(0,0,0,.45))}
.ice{background-image:repeating-linear-gradient(60deg,rgba(255,255,255,.4) 0 2px,transparent 2px 16px),linear-gradient(135deg,rgba(255,255,255,.9),rgba(255,255,255,0) 40%,rgba(255,255,255,.7) 72%)}
.electric{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.5) 0 7px,rgba(0,0,0,.3) 7px 14px),radial-gradient(circle at 50% 40%,rgba(255,255,255,.8),transparent 65%)}
.plain{background-image:linear-gradient(180deg,rgba(255,255,255,.55),rgba(0,0,0,.25))}
/* power cards */
.pw{container-type:inline-size}
.pcard{position:relative;container-type:inline-size;aspect-ratio:5/7;border-radius:6cqw;overflow:hidden;background:linear-gradient(160deg,#1c5d8f,#0a2a44);border:1.6cqw solid #fff;box-shadow:0 8px 20px rgba(0,40,80,.35);font-family:Nunito,sans-serif}
.pimg{position:absolute;inset:0;overflow:hidden}
.pimg img{position:absolute;max-width:none;pointer-events:none}
.pcost{position:absolute;left:0;top:0;width:30cqw;height:20cqw;background:#fff;border-bottom-right-radius:9cqw;display:flex;align-items:center;justify-content:center;gap:1cqw;z-index:2;padding-right:2cqw}
.pcost .ic{width:11cqw;height:11cqw}
.ptitle{position:absolute;left:30cqw;right:3cqw;top:5cqw;text-align:center;color:#fff;transform:rotate(-3deg);z-index:2;word-break:break-word}
.pbox{position:absolute;left:4cqw;right:4cqw;bottom:4cqw;min-height:24cqw;background:#fff;border-radius:9cqw 9cqw 7cqw 7cqw;padding:6cqw 4cqw 3.5cqw;text-align:center;display:flex;align-items:center;justify-content:center;z-index:2}
.pdesc{font-weight:800;color:#222;line-height:1.2;white-space:pre-wrap}
.ptype{position:absolute;top:-3.4cqw;left:50%;transform:translateX(-50%);padding:.4cqw 5cqw;border-radius:3cqw;font-family:'Luckiest Guy',Impact,sans-serif;font-size:4.8cqw;color:#fff;border:.7cqw solid #fff}
.ptype.keep{background:linear-gradient(#4aa3ff,#1d62c9)}.ptype.discard{background:linear-gradient(#ff6b5a,#c4281c)}
.cardstage{width:min(100%,340px);margin:0 auto;cursor:grab;touch-action:none;user-select:none}
/* modal */
#modal{position:fixed;inset:0;z-index:20;background:rgba(0,30,60,.55);display:none;place-items:center;padding:14px;overflow:auto}
#modal .mb{max-width:760px;width:100%;padding:18px;margin:auto;background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(225,242,252,.88))}
#mc{max-width:100%;max-height:56vh;width:auto;height:auto;touch-action:none;cursor:crosshair}
.exl{display:grid;gap:8px}.exi{text-align:left;border-radius:14px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);padding:10px 20px;z-index:30;display:none}
/* print sheets */
#printRoot{display:none}
.sheet{background:#fff;color:#000;position:relative;overflow:hidden;box-shadow:0 6px 20px rgba(0,0,0,.3);margin:0 auto 14px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sheet .row1{display:flex;gap:4mm;align-items:flex-start;margin-bottom:4mm}
.sheet .g3{display:flex;flex-wrap:wrap;gap:4mm}
.pc{outline:.25mm dashed #777;outline-offset:.6mm;flex:none}
.pc .stage{box-shadow:none;border-radius:0}
.pc .evo{box-shadow:none!important;border-radius:0!important}
.pc .cfig{width:100%;margin:0;background:#fff}
.x .stage,.x .evo,.x .pcard{box-shadow:none!important}
@media print{html,body{background:#fff!important}body::before{display:none}#app,#toast,#saved,#modal{display:none!important}#printRoot{display:block}#printRoot .sheet{box-shadow:none;margin:0;break-after:page;page-break-after:always}#printRoot .sheet:last-child{break-after:auto;page-break-after:auto}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
</head>
<body>
<div id="saved" class="glass">Starting…</div>
<div id="app"></div>
<div id="printRoot"></div>
<div id="modal"></div>
<div id="toast" class="glass"></div>
<style id="pg"></style>
<script>
const FONT_URL='https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Nunito:wght@600;800&family=Bangers&family=Bungee&family=Chewy&family=Creepster&family=Permanent+Marker&family=Pacifico&family=Bubblegum+Sans&family=Rubik+Mono+One&family=Press+Start+2P&display=swap';
const $=(s,e=document)=>e.querySelector(s), app=$('#app'), modal=$('#modal');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cl=(v,a,b)=>Math.min(b,Math.max(a,v));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const safe=s=>String(s).replace(/[\\/:*?"<>|]/g,'').trim()||'file';
let S={chars:[],cards:[],paper:'letter'},cur=null,curCard=null,view='monsters',sort='new',tab='details',mode='crop',sel=null,evI=0,drag=null,db=null,M=null,EX=[],EXZ='assets';

/* ---------- local storage (IndexedDB, autosave) ---------- */
const dbOpen=()=>new Promise((res,rej)=>{const r=indexedDB.open('tokyoMonsterMaker',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const dbGet=k=>new Promise((res,rej)=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});
const dbPut=(k,v)=>new Promise((res,rej)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)});
function setSaved(s){const e=$('#saved');e.textContent=s==='ok'?'✓ Saved on this computer':s==='busy'?'● Saving…':'⚠ Can’t save in this browser mode';}
let saveT=null;
function save(){setSaved('busy');clearTimeout(saveT);saveT=setTimeout(doSave,400)}
async function doSave(){saveT=null;try{if(db)await dbPut('state',S);else localStorage.setItem('kotMonsters2',JSON.stringify(S));setSaved('ok')}catch(e){setSaved('err')}}
addEventListener('pagehide',()=>{if(saveT){clearTimeout(saveT);doSave()}});
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',3600)}

/* ---------- data fixes ---------- */
function fix(c){c.id=c.id||uid();c.created=c.created||Date.now();c.name=c.name||'New Monster';
const e0=(c.evos||[])[0];if(!c.style&&e0&&e0.bg)c.style={tex:e0.tex,bg:e0.bg,ol:e0.ol,icon:e0.icon};
c.style=Object.assign({tex:'metal',bg:'#a0572a',ol:'#b4601c',icon:'☣'},c.style||{});
const h=c.health=c.health||{};Object.assign(h,{src:h.src||null,r:h.r||1.6,z:h.z||1,u:h.u??.5,v:h.v??.5});h.texts=(h.texts||[]).map(t=>Object.assign({f:'Luckiest Guy',rot:0},t));
if(c.figure){if(!c.figure.orig)c.figure.orig=c.figure.src;c.figure.ol=Object.assign({on:true,c:'#ffffff',w:14},c.figure.ol||{})}
c.evos=(c.evos||[]).map(e=>({type:e.type||'perm',title:e.title||'',desc:e.desc||''}));return c}
function fixCard(c){c.id=c.id||uid();c.created=c.created||Date.now();c.name=c.name||'New Card';c.cost=c.cost??3;c.type=c.type||'keep';c.desc=c.desc||'';c.to=c.to||'#e0568f';return c}

/* ---------- symbols ---------- */
const IC={star:'<path fill="#2a8cf0" stroke="#0b3f8a" stroke-width="1.5" d="M12 2l3 6.9 7.5.7-5.7 4.9 1.7 7.3L12 17.8l-6.5 4 1.7-7.3-5.7-4.9L9 8.9z"/>',
heart:'<path fill="#e5202f" stroke="#7a0510" stroke-width="1.5" d="M12 21s-8-5.2-8-11a4.5 4.5 0 018-2.8A4.5 4.5 0 0120 10c0 5.8-8 11-8 11z"/>',
energy:'<path fill="#3fd13f" stroke="#136b13" stroke-width="1.5" d="M13 2L4 14h6l-1 8 9-12h-6z"/>',
claw:'<path d="M5 3c3 5 4 11 3 18M11 2c3 5 4 12 2 19M17 3c3 5 4 11 2 18" stroke="#222" fill="none" stroke-width="2.6" stroke-linecap="round"/>'};
const sym=k=>`<svg class="ic" viewBox="0 0 24 24">${IC[k]}</svg>`;
const BOLT='<svg class="ic" viewBox="0 0 24 24"><path fill="#ffd400" stroke="#333" stroke-width="1.5" d="M13 2L4 14h6l-1 8 9-12h-6z"/></svg>';
const desc=s=>esc(s).replace(/\{(star|heart|energy|claw)\}/g,(m,k)=>sym(k));
const TEX=['metal','ocean','fire','ice','electric','plain'];
const ICONS=['none','☣','☠','⚡','🔥','🦖','🐙','🤖','👽','🐲','🌀','🦆','🐰','🦀'];
const SW=['#ffffff','#ffd400','#ff4b3e','#3ec6ff','#7ee03a','#ff7ad9'];
const FONTS=['Luckiest Guy','Bangers','Bungee','Chewy','Creepster','Permanent Marker','Pacifico','Bubblegum Sans','Rubik Mono One','Press Start 2P'];

/* ---------- rendering helpers ---------- */
function dims(m,a){const r=m.r||a,z=m.z||1;if(m.contain)return r>=a?[z,z*a/r]:[z*r/a,z];return r>=a?[z*r/a,z]:[z,z*a/r]}
function imgH(m,a){if(!m||!m.src)return'<div class="ph">Upload an image to begin</div>';const[iw,ih]=dims(m,a);
return `<img alt="" src="${m.src}" style="width:${iw*100}%;height:${ih*100}%;left:${-(iw-1)*m.u*100}%;top:${-(ih-1)*m.v*100}%">`}
const txH=(t,on)=>`<span class="tx${on?' sel':''}" data-t="${t.id}" style="left:${t.x}%;top:${t.y}%;font-size:${t.s}cqw;color:${t.c};font-family:'${t.f}','Luckiest Guy',Impact,sans-serif;transform:translate(-50%,-50%) rotate(${t.rot||0}deg)">${esc(t.v)}${on?'<i class="rot"></i>':''}</span>`;
const WIN=`<div class="hw hwl"><svg class="hi" viewBox="0 0 24 24">${IC.star}</svg><i class="hole"></i></div><div class="hw hwr"><i class="hole"></i><svg class="hi" viewBox="0 0 24 24">${IC.heart}</svg></div>`;
const healthIn=(h,edit)=>imgH(h,1.6)+(h.texts||[]).map(t=>txH(t,edit&&mode==='text'&&t.id===sel)).join('')+WIN;

const pages=[ev.slice(0,rows1*3)];let i=rows1*3;while(i<ev.length){pages.push(ev.slice(i,i+rowsN*3));i+=rowsN*3}
return{n:pages.length,html:pages.map((p,k)=>`<div class="sheet" style="width:${W}mm;height:${H-1}mm;padding:${m}mm">${k===0?`<div class="row1">${hc}${fg}</div>`:''}<div class="g3">${p.join('')}</div></div>`).join('')}}

/* ---------- images ---------- */
function load(file,max){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
res({src:c.toDataURL(file.type==='image/png'?'image/png':'image/jpeg',.88),r:c.width/c.height,z:1,u:.5,v:.5})};im.src=r.result};r.readAsDataURL(file)})}
const loadImg=src=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src});
async function rebuildFig(f){if(!f)return;
if(!f.cut||!f.ol.on){const base=f.cut||f.orig,im=await loadImg(base);f.src=base;f.r=im.width/im.height;f.contain=!!f.cut;return}
const im=await loadImg(f.cut),w=f.ol.w,p=w+2,c=document.createElement('canvas');c.width=im.width+p*2;c.height=im.height+p*2;const x=c.getContext('2d');
const t=document.createElement('canvas');t.width=im.width;t.height=im.height;const tx=t.getContext('2d');tx.drawImage(im,0,0);tx.globalCompositeOperation='source-in';tx.fillStyle=f.ol.c;tx.fillRect(0,0,t.width,t.height);
for(let rr=w;rr>0;rr-=Math.max(1,w/5))for(let a=0;a<48;a++){const th=a/48*Math.PI*2;x.drawImage(t,p+Math.cos(th)*rr,p+Math.sin(th)*rr)}
x.drawImage(t,p,p);x.drawImage(im,p,p);f.src=c.toDataURL('image/png');f.r=c.width/c.height;f.contain=true}
let figT;function figChanged(){clearTimeout(figT);figT=setTimeout(async()=>{await rebuildFig(cur.figure);paint()},120)}

/* ---------- cut-out tool ---------- */
async function openCut(m){const f=cur.figure;if(!f||!f.orig)return toast('Upload a figure image first.');const im=await loadImg(f.orig),w=im.width,h=im.height,cv=document.createElement('canvas');cv.width=w;cv.height=h;const cx=cv.getContext('2d',{willReadFrequently:true});cx.drawImage(im,0,0);
const id=cx.getImageData(0,0,w,h);M={mode:m,w,h,cv,src:id,key:autoKey(id,w,h),tol:40,pts:[],closed:false,down:false};showCut()}
function autoKey(id,w,h){const d=id.data,R=[],G=[],B=[],add=(x,y)=>{const j=(y*w+x)*4;R.push(d[j]);G.push(d[j+1]);B.push(d[j+2])};for(let x=0;x<w;x+=4){add(x,0);add(x,h-1)}for(let y=0;y<h;y+=4){add(0,y);add(w-1,y)}const m=a=>a.sort((p,q)=>p-q)[a.length>>1];return[m(R),m(G),m(B)]}
function autoMask(){const{w,h,src,key,tol}=M,d=src.data,mask=new Uint8Array(w*h).fill(255),q=new Int32Array(w*h),seen=new Uint8Array(w*h),t2=tol*tol;let qh=0,qt=0;
const push=i=>{if(seen[i])return;const j=i*4,dr=d[j]-key[0],dg=d[j+1]-key[1],db=d[j+2]-key[2];if(d[j+3]<10||dr*dr+dg*dg+db*db<=t2){seen[i]=1;mask[i]=0;q[qt++]=i}};
for(let x=0;x<w;x++){push(x);push((h-1)*w+x)}for(let y=0;y<h;y++){push(y*w);push(y*w+w-1)}
while(qh<qt){const i=q[qh++],x=i%w;if(x>0)push(i-1);if(x<w-1)push(i+1);if(i>=w)push(i-w);if(i<w*(h-1))push(i+w)}
const o=new Uint8Array(w*h);for(let y=0;y<h;y++)for(let x=0;x<w;x++){let s=0,n=0;for(let dy=-1;dy<=1;dy++){const yy=y+dy;if(yy<0||yy>=h)continue;for(let dx=-1;dx<=1;dx++){const xx=x+dx;if(xx<0||xx>=w)continue;s+=mask[yy*w+xx];n++}}o[y*w+x]=s/n}return o}
function manualMask(){const c=document.createElement('canvas');c.width=M.w;c.height=M.h;const x=c.getContext('2d');x.beginPath();M.pts.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.closePath();x.fillStyle='#fff';x.fill();const d=x.getImageData(0,0,M.w,M.h).data,m=new Uint8Array(M.w*M.h);for(let i=0;i<m.length;i++)m[i]=d[i*4+3];return m}
function fullCv(mask){const c=document.createElement('canvas');c.width=M.w;c.height=M.h;const x=c.getContext('2d'),id=x.createImageData(M.w,M.h);id.data.set(M.src.data);for(let i=0;i<mask.length;i++)id.data[i*4+3]=Math.min(id.data[i*4+3],mask[i]);x.putImageData(id,0,0);return c}
function trim(c){const d=c.getContext('2d').getImageData(0,0,c.width,c.height).data;let x0=c.width,y0=c.height,x1=-1,y1=-1;for(let y=0;y<c.height;y++)for(let x=0;x<c.width;x++)if(d[(y*c.width+x)*4+3]>10){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}if(x1<0)return null;const o=document.createElement('canvas');o.width=x1-x0+1;o.height=y1-y0+1;o.getContext('2d').drawImage(c,x0,y0,o.width,o.height,0,0,o.width,o.height);return o}
function showCut(){modal.style.display='grid';const a=M.mode==='auto';
modal.innerHTML=`<div class="mb glass"><h2>Cut out your figure</h2><div class="row" style="margin-bottom:10px"><button class="chip${a?' on':''}" data-m="mode" data-v="auto">Auto</button><button class="chip${!a?' on':''}" data-m="mode" data-v="manual">Draw it myself</button></div>
<p class="note">${a?'Click the background to choose the colour to remove, then fine-tune with the slider. Works best on plain backgrounds.':'Click around your figure to place points, or press and drag to draw freehand. Click the yellow start dot (or Finish shape) to close the outline.'}</p>
<div style="text-align:center"><div class="chk" style="display:inline-block;line-height:0;border-radius:12px;overflow:hidden"><canvas id="mc" width="${M.w}" height="${M.h}"></canvas></div></div>
${a?`<label class="f" style="margin-top:10px">Tolerance<input type="range" min="5" max="160" value="${M.tol}" data-mf="tol"></label>`:`<div class="row" style="margin-top:10px"><button data-m="undo">Undo point</button><button data-m="clear">Start over</button><button data-m="finish">Finish shape</button></div>`}
<div class="row" style="margin-top:12px"><button class="go" data-m="apply">Apply cut-out</button><button data-m="close">Cancel</button></div></div>`;
if(a)M.mask=autoMask();mDraw()}
function mDraw(){const cv=$('#mc');if(!cv||!M)return;const x=cv.getContext('2d');x.clearRect(0,0,M.w,M.h);
if(M.mode==='auto')x.drawImage(fullCv(M.mask),0,0);
else if(M.closed)x.drawImage(fullCv(manualMask()),0,0);
else{x.globalAlpha=.65;x.drawImage(M.cv,0,0);x.globalAlpha=1;const lw=Math.max(2,M.w/260);
if(M.pts.length){x.lineJoin='round';x.beginPath();M.pts.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.strokeStyle='#000';x.lineWidth=lw*2;x.stroke();x.strokeStyle='#fff';x.lineWidth=lw;x.stroke();
M.pts.forEach((p,i)=>{x.beginPath();x.arc(p[0],p[1],lw*(i?1.6:3),0,7);x.fillStyle=i?'#fff':'#ffe14d';x.fill();x.strokeStyle='#000';x.lineWidth=lw*.7;x.stroke()})}}}
const mpos=e=>{const cv=$('#mc'),r=cv.getBoundingClientRect(),k=cv.width/r.width;return[(e.clientX-r.left)*k,(e.clientY-r.top)*k,k]};
modal.addEventListener('pointerdown',e=>{if(!M||e.target.id!=='mc')return;const[x,y,k]=mpos(e);
if(M.mode==='auto'){const j=(Math.floor(y)*M.w+Math.floor(x))*4,d=M.src.data;M.key=[d[j],d[j+1],d[j+2]];M.mask=autoMask();return mDraw()}
if(M.closed){M.pts=[];M.closed=false}
if(M.pts.length>=3&&Math.hypot(x-M.pts[0][0],y-M.pts[0][1])<16*k){M.closed=true;return mDraw()}
M.pts.push([x,y]);M.down=true;mDraw();e.preventDefault()});
modal.addEventListener('pointermove',e=>{if(!M||!M.down)return;const[x,y,k]=mpos(e),l=M.pts[M.pts.length-1];if(Math.hypot(x-l[0],y-l[1])>7*k){M.pts.push([x,y]);mDraw()}});
addEventListener('pointerup',()=>{if(M)M.down=false});
modal.addEventListener('input',e=>{if(M&&e.target.dataset.mf==='tol'){M.tol=+e.target.value;M.mask=autoMask();mDraw()}});
async function applyCut(){const m=M.mode==='auto'?M.mask:(M.closed?manualMask():null);if(!m)return toast('Close the shape first: click the yellow start dot or press Finish shape.');
const t=trim(fullCv(m));if(!t)return toast('Nothing is left after the cut-out. Try a different setting.');const f=cur.figure;f.cut=t.toDataURL('image/png');f.z=1;f.u=.5;f.v=.5;await rebuildFig(f);closeModal();render();toast('Cut-out applied.')}
function closeModal(){modal.style.display='none';modal.innerHTML='';M=null}
addEventListener('keydown',e=>{if(e.key==='Escape'&&modal.style.display==='grid')closeModal()});

/* ---------- export (PNG + zip) ---------- */
let fontCss=null,warmed=false;
async function getFontCss(){if(fontCss!==null)return fontCss;try{let css=await (await fetch(FONT_URL)).text();const lat=[...css.matchAll(/\/\* latin \*\/\s*@font-face\s*\{[^}]*\}/g)].map(m=>m[0]);if(lat.length)css=lat.join('\n');
const urls=[...new Set([...css.matchAll(/url\((https:[^)]+)\)/g)].map(m=>m[1]))];
for(const u of urls){const b=await (await fetch(u)).blob(),d=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(b)});css=css.split(u).join(d)}fontCss=css}catch(e){fontCss=''}return fontCss}
async function toPng(html,w,h,scale){const fonts=await getFontCss(),css=document.querySelector('style').textContent,wrap=document.createElement('div');
wrap.setAttribute('xmlns','http://www.w3.org/1999/xhtml');wrap.className='x';wrap.style.cssText=`width:${w}px;height:${h}px;position:relative`;wrap.innerHTML=`<style>${fonts}\n${css}</style>${html}`;
const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"><foreignObject x="0" y="0" width="100%" height="100%">${new XMLSerializer().serializeToString(wrap)}</foreignObject></svg>`;
const url='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
if(!warmed){warmed=true;try{await loadImg(url)}catch(e){}await new Promise(r=>setTimeout(r,150))}
const im=await loadImg(url),c=document.createElement('canvas');c.width=w*scale;c.height=h*scale;const x=c.getContext('2d');x.scale(scale,scale);x.drawImage(im,0,0);
return new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('blocked')),'image/png'))}
const dataBlob=async u=>(await fetch(u)).blob();
function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2500)}
function crc32(u8){if(!crc32.t){crc32.t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;crc32.t[n]=c}}let crc=-1;for(let i=0;i<u8.length;i++)crc=crc32.t[(crc^u8[i])&255]^(crc>>>8);return(crc^-1)>>>0}
function zip(files){const enc=new TextEncoder(),parts=[],cen=[];let off=0;
for(const f of files){const n=enc.encode(f.name),c=crc32(f.data),L=f.data.length,h=new DataView(new ArrayBuffer(30));
h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(12,0x21,true);h.setUint32(14,c,true);h.setUint32(18,L,true);h.setUint32(22,L,true);h.setUint16(26,n.length,true);
parts.push(h.buffer,n,f.data);
const g=new DataView(new ArrayBuffer(46));g.setUint32(0,0x02014b50,true);g.setUint16(4,20,true);g.setUint16(6,20,true);g.setUint16(8,0x0800,true);g.setUint16(14,0x21,true);g.setUint32(16,c,true);g.setUint32(20,L,true);g.setUint32(24,L,true);g.setUint16(28,n.length,true);g.setUint32(42,off,true);
cen.push(g.buffer,n);off+=30+n.length+L}
let cs=0;for(let i=0;i<cen.length;i++)cs+=cen[i].byteLength;
const e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);
return new Blob([...parts,...cen,e.buffer],{type:'application/zip'})}
function exportItems(ch){const it=[],f=ch.figure;
if(f&&f.src)it.push({n:`${ch.name} - figure.png`,label:'Board figure',get:()=>dataBlob(f.src)});
it.push({n:`${ch.name} - health card.png`,label:'Health and point card',get:()=>toPng(`<div style="width:600px">${hcH(ch.health)}</div>`,600,375,2)});
ch.evos.forEach((e,i)=>it.push({n:`${ch.name} - evolution ${i+1} - ${e.title}.png`,label:`Evolution ${i+1}: ${e.title}`,get:()=>toPng(`<div style="width:375px">${evoFull(e,ch)}</div>`,375,375,2)}));return it}
const cardPng=c=>toPng(`<div style="width:300px">${pcardH(c)}</div>`,300,420,2.5);
function openExport(items,zname,title){EX=items;EXZ=zname;modal.style.display='grid';
modal.innerHTML=`<div class="mb glass"><h2>${esc(title)}</h2><p class="note">Click an item to download it as a PNG, or export everything at once.</p><div class="row" style="margin-bottom:12px"><button class="go" data-m="zipall">Export all (.zip)</button><button data-m="close">Close</button></div><div class="exl">${items.map((x,i)=>`<button class="exi" data-m="dl" data-i="${i}">⬇ ${esc(x.label)}</button>`).join('')||'<p>Nothing to export yet.</p>'}</div></div>`}
async function zipAll(){toast('Building zip…');try{const files=[];for(const [i,it] of EX.entries()){const b=await it.get();files.push({name:String(i+1).padStart(2,'0')+' '+safe(it.n),data:new Uint8Array(await b.arrayBuffer())})}dl(zip(files),safe(EXZ)+'.zip');toast('Exported to your downloads.')}catch(e){toast('Export failed. Try Chrome or Edge.')}}
modal.addEventListener('click',async e=>{if(e.target===modal)return closeModal();const b=e.target.closest('[data-m]');if(!b)return;const a=b.dataset.m;
if(a==='close')return closeModal();
if(a==='mode'){M.mode=b.dataset.v;M.pts=[];M.closed=false;return showCut()}
if(a==='undo'){M.pts.pop();M.closed=false;return mDraw()}
if(a==='clear'){M.pts=[];M.closed=false;return mDraw()}
if(a==='finish'){if(M.pts.length<3)return toast('Place at least 3 points first.');M.closed=true;return mDraw()}
if(a==='apply')return applyCut();
if(a==='zipall')return zipAll();
if(a==='dl'){const it=EX[+b.dataset.i];try{dl(await it.get(),safe(it.n))}catch(x){toast('Export failed. Try Chrome or Edge.')}}});

/* ---------- events ---------- */
app.addEventListener('change',async e=>{const f=e.target;if(f.type!=='file'||!f.files[0])return;const k=f.dataset.k;
if(k==='restore'){try{const o=JSON.parse(await f.files[0].text());if(!o.chars)throw 0;if(!confirm('Replace everything currently saved with this backup?'))return;S=Object.assign({chars:[],cards:[],paper:'letter'},o);S.chars.forEach(fix);S.cards.forEach(fixCard);save();render();toast('Backup restored.')}catch(x){toast('That file is not a valid backup.')}return}
const m=await load(f.files[0],k==='health'?1400:1000);
if(k==='figure')cur.figure={orig:m.src,src:m.src,r:m.r,z:1,u:.5,v:.5,contain:false,cut:null,ol:{on:true,c:'#ffffff',w:14}};
else if(k==='card')curCard.img=m;
else{const t=cur.health.texts;Object.assign(cur.health,m);if(!t.length)cur.health.texts=[{id:'t1',v:cur.name,x:50,y:86,s:10,c:'#ffffff',f:'Luckiest Guy',rot:0}]}
save();render()});
app.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.box')){e.preventDefault();e.target.click()}});
app.addEventListener('click',async e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,d=b.dataset,E=cur&&cur.evos[evI];
if(a==='view'){view=d.v;return render()}
if(a==='new'){cur={id:uid(),created:Date.now(),name:'New Monster',figure:null,health:{src:null,r:1.6,z:1,u:.5,v:.5,texts:[]},evos:[]};fix(cur);S.chars.push(cur);tab='details';evI=0;sel=null;return render()}
if(a==='open'){cur=S.chars.find(c=>c.id===d.id);tab='details';evI=0;sel=null;return render()}
if(a==='home'){cur=null;curCard=null;save();return render()}
if(a==='del'){if(confirm('Delete '+cur.name+' and all of its evolutions?')){S.chars=S.chars.filter(c=>c!==cur);cur=null;save();render()}return}
if(a==='tab'){tab=d.t;return render()}
if(a==='mode'){mode=d.m;sel=null;return render()}
if(a==='addtx'){const t={id:'t'+Date.now(),v:'Text',x:50,y:50,s:10,c:'#ffffff',f:'Luckiest Guy',rot:0};cur.health.texts.push(t);sel=t.id;return render()}
if(a==='deltx'){cur.health.texts=cur.health.texts.filter(t=>t.id!==sel);sel=null;return render()}
if(a==='swatch'){const t=cur.health.texts.find(t=>t.id===sel);if(t){t.c=d.c;$('#tc').value=d.c;paint()}return}
if(a==='cut')return openCut(d.m);
if(a==='uncut'){cur.figure.cut=null;cur.figure.z=1;await rebuildFig(cur.figure);return render()}
if(a==='newevo'){cur.evos.push(newEvo());evI=cur.evos.length-1;return render()}
if(a==='pick'){evI=+d.i;return render()}
if(a==='dupevo'){cur.evos.splice(evI+1,0,{...E});evI++;return render()}
if(a==='delevo'){cur.evos.splice(evI,1);evI=Math.max(0,evI-1);return render()}
if(a==='etype'){E.type=d.v;return render()}
if(a==='sicon'){cur.style.icon=d.v;return render()}
if(a==='stex'){cur.style.tex=d.v;return render()}
if(a==='ins'){const ta=$('#ed'),tg=d.for==='card'?curCard:E,p=ta.selectionStart,tok='{'+d.k+'}';ta.value=ta.value.slice(0,p)+tok+ta.value.slice(ta.selectionEnd);tg.desc=ta.value;ta.focus();ta.setSelectionRange(p+tok.length,p+tok.length);return paint()}
if(a==='export')return openExport(exportItems(cur),cur.name+' - assets',`Export assets for ${cur.name}`);
if(a==='doprint')return doPrint();
if(a==='newcard'){curCard=fixCard({name:'New Card',cost:3,type:'keep',desc:'Gain 2 {star}.',img:null});S.cards.push(curCard);return render()}
if(a==='opencard'){curCard=S.cards.find(c=>c.id===d.id);return render()}
if(a==='ctype'){curCard.type=d.v;return render()}
if(a==='dupcard'){const c=fixCard({...curCard,id:null,created:Date.now(),name:curCard.name+' copy'});S.cards.push(c);curCard=c;return render()}
if(a==='delcard'){if(confirm('Delete '+curCard.name+'?')){S.cards=S.cards.filter(c=>c!==curCard);curCard=null;save();render()}return}
if(a==='cardpng'){try{dl(await cardPng(curCard),safe(curCard.name)+'.png')}catch(x){toast('Export failed. Try Chrome or Edge.')}return}
if(a==='expcards')return openExport(S.cards.map(c=>({n:`${c.name}.png`,label:`${c.name} (${c.cost}⚡ ${c.type})`,get:()=>cardPng(c)})),'Power cards','Export power cards');
if(a==='backup')return dl(new Blob([JSON.stringify(S)],{type:'application/json'}),'tokyo-monster-maker-backup.json')});

app.addEventListener('input',e=>{const t=e.target,f=t.dataset.f;if(!f)return;const v=t.value,k=t.dataset.k;
if(f==='sort'){sort=v;return render()}
if(f==='paper'){S.paper=v;return render()}
if(f==='cname'){cur.name=v;return save()}
if(f==='z'){const m=k==='figure'?cur.figure:k==='card'?curCard.img:cur.health;if(m)m.z=+v;return paint()}
if(f.startsWith('c-')){const p=f.slice(2);curCard[p]=p==='cost'?+v:v;if(p==='cost')$('#costv').textContent=v;return paint()}
if(f.startsWith('fo-')){const o=cur.figure.ol;if(f==='fo-on')o.on=t.checked;if(f==='fo-c')o.c=v;if(f==='fo-w')o.w=+v;return figChanged()}
if(f.startsWith('s-')){cur.style[f.slice(2)]=v;return paint()}
if(f.startsWith('e-')){cur.evos[evI][f.slice(2)]=v;return paint()}
if(f[0]==='t'){const x=cur.health.texts.find(x=>x.id===sel);if(!x)return;if(f==='tv')x.v=v;if(f==='ts')x.s=+v;if(f==='tc')x.c=v;if(f==='tf')x.f=v;if(f==='tr')x.rot=+v;paint()}});

/* dragging: pan the crop, move text, rotate text */
app.addEventListener('pointerdown',e=>{const st=e.target.closest('#stage');if(!st)return;const k=st.dataset.k,r=st.getBoundingClientRect();
if(k==='health'&&mode==='text'){const el=e.target.closest('[data-t]');if(!el){if(sel){sel=null;render()}return}
const t=cur.health.texts.find(x=>x.id===el.dataset.t);if(!t)return;
if(e.target.closest('.rot')){const b=el.getBoundingClientRect();drag={k:'r',t,cx:b.left+b.width/2,cy:b.top+b.height/2};e.preventDefault();return}
const changed=sel!==t.id;sel=t.id;drag={k:'t',t,r,ox:(e.clientX-r.left)/r.width*100-t.x,oy:(e.clientY-r.top)/r.height*100-t.y};if(changed)render();e.preventDefault();return}
if(k==='health'&&mode==='text')return;
const m=k==='figure'?cur.figure:k==='card'?curCard.img:cur.health;if(!m||!m.src)return;
drag={k:'c',m,a:k==='figure'?.75:k==='card'?5/7:1.6,r,x:e.clientX,y:e.clientY,u:m.u,v:m.v};e.preventDefault()});
addEventListener('pointermove',e=>{if(!drag)return;
if(drag.k==='r'){let a=Math.atan2(e.clientY-drag.cy,e.clientX-drag.cx)*180/Math.PI+90;a=((a+180)%360+360)%360-180;const s=Math.round(a/15)*15;if(Math.abs(a-s)<4)a=s;drag.t.rot=Math.round(a)}
else if(drag.k==='t'){const r=drag.r;drag.t.x=cl((e.clientX-r.left)/r.width*100-drag.ox,0,100);drag.t.y=cl((e.clientY-r.top)/r.height*100-drag.oy,0,100)}
else{const r=drag.r,[iw,ih]=dims(drag.m,drag.a);if(Math.abs(iw-1)>.001)drag.m.u=cl(drag.u-(e.clientX-drag.x)/(r.width*(iw-1)),0,1);if(Math.abs(ih-1)>.001)drag.m.v=cl(drag.v-(e.clientY-drag.y)/(r.height*(ih-1)),0,1)}
paint()});
addEventListener('pointerup',()=>{if(drag&&(drag.k==='t'||drag.k==='r'))syncTx();drag=null});
function syncTx(){const t=(cur&&cur.health.texts||[]).find(t=>t.id===sel),c=$('#txc');if(!c||!t)return;c.style.opacity=1;c.style.pointerEvents='auto';$('#tv').value=t.v;$('#ts').value=t.s;$('#tc').value=t.c;$('#tf').value=t.f;$('#tr').value=t.rot||0}

/* ---------- start ---------- */
(async()=>{let ok=true;
try{db=await dbOpen();const s=await dbGet('state');if(s)S=s;else{try{const o=JSON.parse(localStorage.getItem('kotMonsters')||'null');if(o&&o.chars)S=o}catch(e){}}}
catch(e){db=null;try{const o=JSON.parse(localStorage.getItem('kotMonsters2')||'null');if(o)S=o}catch(x){ok=false}}
S.chars=S.chars||[];S.cards=S.cards||[];S.paper=S.paper||'letter';S.chars.forEach(fix);S.cards.forEach(fixCard);
setSaved(ok?'ok':'err');render()})();
</script>
