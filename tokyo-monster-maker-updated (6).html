<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tokyo Monster Maker – King of Tokyo custom characters</title>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Nunito:wght@600;800&family=Bangers&family=Bungee&family=Chewy&family=Creepster&family=Permanent+Marker&family=Pacifico&family=Bubblegum+Sans&family=Rubik+Mono+One&family=Press+Start+2P&family=Saira:wght@700;800&family=Source+Sans+3:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--sky1:#07152f;--sky2:#123f78;--sky3:#0b2b52;--ink:#102a43;--glass1:rgba(255,255,255,.94);--glass2:rgba(255,255,255,.82);--edge:rgba(255,255,255,.9);--green:#59c21e;--green2:#2c8a0f;--evf:'Eurostile Bold','Eurostile','Eurostile LT Std','EurostileBold','Saira',Arial,sans-serif;--myrb:'Myriad Pro','Myriad Pro Bold','MyriadPro-Bold','Source Sans 3',Arial,sans-serif;--myr:'Myriad Pro SemiBold','Myriad Pro','MyriadPro-Semibold','Source Sans 3','Source Sans Pro',Arial,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Keep interface surfaces readable regardless of the operating-system theme. */
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;font:500 15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--ink);background:linear-gradient(145deg,#061329 0%,#0b2b55 48%,#174b83 100%);background-color:#0b2b55;background-attachment:fixed;overflow-x:hidden}
body::before{display:none;content:none}
#app{position:relative;max-width:1180px;margin:0 auto;padding:22px 18px 60px}
.glass{background:linear-gradient(180deg,var(--glass1),var(--glass2) 52%,rgba(255,255,255,.3));border:1px solid var(--edge);border-radius:20px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 10px 30px rgba(0,50,90,.25),inset 0 1px 0 #fff}
h1,.kot{font-family:'Luckiest Guy',Impact,sans-serif;font-weight:400;letter-spacing:.02em}
h2{font-family:Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;font-weight:750;letter-spacing:-.02em}
h1{font-size:clamp(34px,6vw,60px);margin:6px 0 0;color:#fff;-webkit-text-stroke:.14em #000;paint-order:stroke fill;text-shadow:0 3px 0 rgba(0,0,0,.3)}
.sub{margin:10px 0 22px;font-size:16px;max-width:820px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.55)}
h2{font-size:22px;margin:0 0 10px;color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.cgrid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.box{cursor:pointer;padding:10px;transition:transform .15s}
.box:hover,.box:focus-visible{transform:translateY(-4px)}
.box .bar{display:flex;justify-content:space-between;padding:10px 4px 2px;gap:8px}
.box .bar span{opacity:.75;font-size:13px;white-space:nowrap}
.new{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:210px;border:2px dashed rgba(255,255,255,.9);text-align:center;gap:6px}
.cgrid .new{min-height:250px}
.new i{font:normal 800 56px/1 Nunito;color:#fff;text-shadow:0 2px 6px rgba(0,60,100,.5)}
.new b{font-size:17px}
button,.btn{font:650 14px Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink);cursor:pointer;border:1px solid var(--edge);border-radius:999px;padding:8px 16px;background:linear-gradient(180deg,#fff,rgba(255,255,255,.45) 50%,rgba(190,225,245,.7));box-shadow:0 2px 6px rgba(0,50,90,.25),inset 0 1px 0 #fff;display:inline-block}
button:hover,.btn:hover{filter:brightness(1.06)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,.box:focus-visible{outline:3px solid #ffe14d;outline-offset:2px}
.go{color:#fff;background:linear-gradient(180deg,#9be85a,var(--green) 50%,var(--green2));border-color:#d6ffb0;text-shadow:0 1px 2px rgba(0,60,0,.6)}
.danger{color:#a01212}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.top input{flex:1;min-width:160px;font:400 26px 'Luckiest Guy',sans-serif}
.blades{display:flex;gap:6px;margin-bottom:-1px;overflow-x:auto;padding-top:4px}
.blade{border-radius:16px 16px 0 0;padding:11px 22px;font-size:15px;border-bottom:0;white-space:nowrap}
.blade,.hn{position:relative;isolation:isolate;overflow:hidden;transition:color .2s,text-shadow .2s}
.blade::before,.hn::before{content:"";position:absolute;inset:0;z-index:-1;opacity:0;transition:opacity .2s ease;background:linear-gradient(180deg,#a6f063,var(--green) 55%,var(--green2))}
.blade.on::before,.hn.on::before{opacity:1}
.blade.on,.hn.on{color:#fff;text-shadow:0 1px 2px rgba(0,60,0,.6)}
.vwrap{position:relative}
.vp{transition:opacity .15s ease}
.vp.off{position:absolute;left:0;right:0;top:0;max-height:100%;overflow:hidden;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .15s ease,visibility 0s linear .15s}
.panel{transition:opacity .06s linear}
.blade::after{content:"";position:absolute;left:50%;bottom:0;width:0;height:3px;border-radius:3px 3px 0 0;background:var(--green);transition:width .22s ease,left .22s ease;pointer-events:none}
.blade:not(.on):hover::after{width:54%;left:23%}
.blade:not(.on):hover{color:#1d5a12}
/* header */
#hdr{position:sticky;top:0;z-index:15;background:linear-gradient(180deg,#d6dadf,#a4aab2);border-bottom:2px solid #6f757d;box-shadow:0 4px 14px rgba(0,0,0,.4);padding:calc(8px + env(safe-area-inset-top,0px)) 18px 10px}
#hdr .in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:8px 20px;flex-wrap:wrap}
#hdr h1{margin:0;font-size:clamp(24px,4.4vw,40px);cursor:pointer;line-height:1.1;user-select:none}
#hdr nav{display:flex;gap:8px;flex-wrap:wrap}
.hn{padding:7px 16px}
.tiny{font-size:11px;opacity:.6;text-align:right;margin:-4px 2px 8px}
.xbtn{position:absolute;top:6px;right:6px;z-index:3;width:26px;height:26px;padding:0;border-radius:50%;font-size:16px;line-height:1;color:#a01212;opacity:0;transition:opacity .15s}
.box{position:relative}
.box:hover .xbtn,.xbtn:focus-visible{opacity:1}
@media(hover:none){.xbtn{opacity:1}}
.pw{transition:transform .12s ease-out;will-change:transform}
textarea[data-f=e-desc]{resize:none}
div.f{display:flex;flex-direction:column;gap:4px;font-size:13px}
.evgrp h3{margin:14px 0 0;font-size:16px}
.evgrp .evlist{margin:8px 0 6px}
.sumgrid{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr);gap:22px;align-items:start;margin:14px 0}
@media(max-width:620px){.sumgrid{grid-template-columns:1fr}}
.sum h3{margin:0 0 8px;font-size:16px}
.sum .evlist{grid-template-columns:repeat(auto-fill,minmax(185px,1fr))}
.box .ph{display:none}
.omon{margin:12px 0 2px;font-size:15px}
.chip.stripe{position:relative;overflow:hidden}
.chip.stripe::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,transparent 0 5px,rgba(0,0,0,.26) 5px 7px);pointer-events:none}
.th.inact .evo,.mcard.inact .evo{filter:grayscale(1);opacity:.55}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;align-items:start}
.mcard{display:flex;flex-direction:column;align-items:center;gap:6px}.mcard .evw{width:100%}
.mcard button{padding:3px 14px;font-size:12px}
#crw{position:relative;display:inline-block;max-width:100%;overflow:hidden;touch-action:none;user-select:none;background:repeating-conic-gradient(#ccd 0 25%,#fff 0 50%) 0 0/16px 16px}
#crw img{display:block;max-width:100%;max-height:60vh;pointer-events:none}
.crr{position:absolute;border:2px dashed #fff;box-shadow:0 0 0 9999px rgba(0,20,40,.6);cursor:move}
.crr i{position:absolute;width:16px;height:16px;background:#ffd400;border:2px solid #000;border-radius:3px}
.olist{display:grid;gap:8px;max-height:58vh;overflow:auto;padding-right:4px}
.orow{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.65);border:1px solid var(--edge)}
.orow small{display:block;opacity:.65;font-size:12px}
.orow p{margin:4px 0 0;font-size:13px}
.bimg{width:34px;height:34px;border-radius:50%;object-fit:cover;vertical-align:middle;border:2px solid #fff}
.disc{text-align:center;color:#fff;opacity:.75;font-size:12px;margin:14px 0 0;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.home-note{color:#fff;opacity:1;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.site-footer{text-align:center;margin-top:10px}.site-footer a{color:#fff}
.panel{padding:20px;border-top-left-radius:0}
.split{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:22px;align-items:start}
@media(max-width:820px){.split{grid-template-columns:1fr}}
.ctl{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px}
input[type=text],textarea,select{font:500 15px Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;color:#102a43;padding:9px 12px;border-radius:12px;border:1px solid var(--edge);background:rgba(255,255,255,.7);box-shadow:inset 0 2px 5px rgba(0,60,100,.18);width:100%}
select option{color:#102a43;background:#fff}
input[type=color]{width:46px;height:36px;padding:0;border:2px solid #fff;border-radius:50%;cursor:pointer;background:none}
input[type=range]{width:100%;accent-color:var(--green)}
.sw{width:26px;height:26px;padding:0;border-radius:50%}
.chip{padding:6px 12px}.chip.on{color:#fff;background:linear-gradient(180deg,#a6f063,var(--green2))}
.pill{display:inline-block;padding:6px 14px;border-radius:999px;font:800 13px Nunito,sans-serif;color:#fff;background:linear-gradient(180deg,#9be85a,var(--green) 55%,var(--green2));border:1px solid #d6ffb0;text-shadow:0 1px 2px rgba(0,60,0,.5)}
.pill.gray{background:linear-gradient(180deg,#fff,#cfe6f5);color:var(--ink);border-color:var(--edge);text-shadow:none}
.sp{padding:14px;margin-bottom:6px}
.note{font-size:13px;opacity:.8}
#saved{position:fixed;top:64px;right:12px;z-index:9;padding:5px 14px;font-size:12px;border-radius:999px;display:none}#saved.err{display:block}
.stage{position:relative;overflow:hidden;container-type:inline-size;border-radius:14px;box-shadow:0 8px 24px rgba(0,40,80,.35);touch-action:none;background:#0a2a44;user-select:none}
.c16{width:100%;aspect-ratio:120/92;cursor:grab}
.cfig{width:62%;margin:0 auto;aspect-ratio:3/4;cursor:grab}
.chk{background:conic-gradient(#cfd8e3 25%,#fff 0 50%,#cfd8e3 0 75%,#fff 0) 0 0/16px 16px}
.stage img{position:absolute;max-width:none;pointer-events:none}
.ph{position:absolute;inset:0;display:grid;place-items:center;color:#9cc;font-size:14px;text-align:center;padding:8px}
.tx{position:absolute;font-family:'Luckiest Guy',Impact,sans-serif;line-height:1;white-space:nowrap;-webkit-text-stroke:.22em #000;paint-order:stroke fill;stroke-linejoin:round;cursor:move;z-index:1}
.tx.sel{outline:.12em dashed #fff;outline-offset:.2em}
.rot{position:absolute;left:50%;top:-5.5cqw;width:3.6cqw;height:3.6cqw;margin-left:-1.8cqw;border-radius:50%;background:#ffe14d;border:.5cqw solid #222;cursor:grab;-webkit-text-stroke:0}
.rot::after{content:"";position:absolute;left:50%;top:100%;width:.4cqw;height:2cqw;margin-left:-.2cqw;background:#fff}
.hw{position:absolute;top:2.5cqw;display:flex;align-items:center;gap:1.2cqw;padding:1cqw 1.4cqw;border-radius:2.2cqw;background:rgba(255,255,255,.9);border:.6cqw solid #1b4f8a;box-shadow:0 .6cqw 1.4cqw rgba(0,0,0,.4);z-index:2;pointer-events:none}
.hwl{left:2.5cqw}.hwr{right:2.5cqw;top:auto;bottom:2.5cqw}
.hi{width:6.5cqw;height:6.5cqw}
.hole2{position:absolute;border:.45cqw dashed #222;border-radius:0;background:rgba(0,0,0,.55);z-index:2;pointer-events:none}
.hi2{position:absolute;width:5cqw;height:5cqw;z-index:2;pointer-events:none;filter:drop-shadow(0 .3cqw .5cqw rgba(0,0,0,.5))}
.sq{position:absolute;display:grid;place-items:center;border:.4cqw solid #14304f;border-radius:0;z-index:2;pointer-events:none}
.sq svg{width:74%;height:74%}
.pin{position:absolute;display:none;width:2cqw;height:2cqw;border-radius:50%;border:.3cqw dashed #fff;box-shadow:0 0 0 .25cqw #000;z-index:2;pointer-events:none}
.pc .pin{display:block}.pc .hole2{background:transparent}
.pc.rd{border-radius:50%;outline-offset:.6mm}
.hole{display:block;width:12cqw;height:7.5cqw;border:.5cqw dashed #222;border-radius:1.2cqw;background:rgba(0,0,0,.55)}
.stand{width:78%;height:16px;margin:-6px auto 0;border-radius:50%;background:radial-gradient(#345,#123);box-shadow:0 6px 12px rgba(0,0,0,.3)}
.evlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:10px;margin:12px 0 18px}
.evlist .th{cursor:pointer;border-radius:12px;padding:3px;border:2px solid transparent}
.evlist .th.on{border-color:#ffe14d}
.evlist .evo{pointer-events:none}
.evw{container-type:inline-size}
.evo,.notch{background-color:var(--bg);background-blend-mode:overlay}
.evo{container-type:inline-size;position:relative;aspect-ratio:1;border-radius:9cqw;overflow:hidden;box-shadow:0 8px 22px rgba(0,40,80,.4);border:1.2cqw solid rgba(0,0,0,.35);font-family:Nunito,sans-serif}
.notch{position:absolute;left:14cqw;right:14cqw;top:17cqw;height:15.5cqw;border-radius:0 0 6cqw 6cqw;border:.8cqw solid rgba(0,0,0,.32);border-top:0;background-size:100cqw 100cqw;background-position:-14cqw -17cqw;background-origin:border-box;background-repeat:no-repeat;display:flex;align-items:center;justify-content:center;padding-top:3cqw;z-index:1}
.otx{font-family:'Luckiest Guy',Impact,sans-serif;font-weight:400;color:#fff;-webkit-text-stroke:.24em var(--ol);paint-order:stroke fill;line-height:1}
.ban{position:absolute;left:9cqw;right:7cqw;top:4.5cqw;height:12cqw;border-radius:3cqw;background:linear-gradient(180deg,#3a2414,#1a0f08);border:.8cqw solid #e0a04a;display:flex;align-items:center;justify-content:center;padding-left:9cqw}
.ban.nob{padding-left:0;left:7cqw}
.cn{white-space:nowrap}
.med{overflow:hidden;position:absolute;left:-5cqw;top:-3cqw;width:16cqw;height:16cqw;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff7a6a,#d01515 60%,#8a0808);border:1cqw solid #fff;display:grid;place-items:center;font-size:8.5cqw;color:#fff;box-shadow:0 1cqw 2cqw rgba(0,0,0,.4)}
.pan{position:absolute;left:6cqw;right:6cqw;top:19cqw;bottom:6cqw;border-radius:6cqw;background:rgba(255,255,255,.9);box-shadow:inset 0 0 0 1cqw rgba(255,255,255,.7);display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;padding:14cqw 5cqw 2cqw;text-align:center}
.lab{font-size:5.2cqw;white-space:nowrap;font-family:var(--evf);font-weight:800;letter-spacing:.03em;line-height:1}.lab .y,.lab .w{font-family:var(--evf);font-weight:800;-webkit-text-stroke:.2em #000;paint-order:stroke fill;stroke-linejoin:round;letter-spacing:.03em}.lab .y{color:#ffd400}.lab .w{color:#fff}
.ttl{transform:rotate(-3deg);padding:0 2cqw;word-break:break-word}
.ds{color:#2b2b2b;font-family:var(--myr);font-weight:600;white-space:pre-wrap;line-height:1.18}

.evo.fire,.evo.electric,.evo.wood,.evo.leaves{background-size:100% 100%;background-repeat:no-repeat}
.evo.fire,.notch.fire,.evo.electric,.notch.electric,.evo.wood,.notch.wood,.evo.leaves,.notch.leaves{background-blend-mode:normal}

/* power cards */
.pw{container-type:inline-size}
.pcard{position:relative;container-type:inline-size;aspect-ratio:5/7;border-radius:6cqw;overflow:hidden;background:linear-gradient(160deg,#1c5d8f,#0a2a44);border:1.6cqw solid #fff;box-shadow:0 8px 20px rgba(0,40,80,.35);font-family:Nunito,sans-serif}
.pimg{position:absolute;inset:0;overflow:hidden}
.pimg img{position:absolute;max-width:none;pointer-events:none}
.pcost{position:absolute;left:0;top:0;width:21cqw;height:21cqw;background:#fff;border-bottom-right-radius:50%;display:flex;align-items:center;justify-content:center;gap:.2cqw;z-index:2;padding:0 1.8cqw 1.8cqw 0}
.pcost .ic{width:6.5cqw;height:6.5cqw}
.ptitle{position:absolute;left:24cqw;right:3cqw;top:4cqw;text-align:center;color:#fff;z-index:2;word-break:break-word}
.pbox{position:absolute;left:0;right:0;margin:0 auto;width:fit-content;min-width:30cqw;max-width:94%;bottom:0;min-height:10cqw;background:#fff;border-radius:9cqw 9cqw 0 0;padding:4cqw 7cqw 3cqw;text-align:center;display:flex;align-items:center;justify-content:center;z-index:2}
.pdesc{font-family:var(--myr);font-weight:600;color:#222;line-height:1.2;white-space:pre-wrap}
.pdesc b,.ds b{font-family:var(--myrb);font-weight:700}
.ptypew{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);white-space:nowrap;line-height:1;pointer-events:none;margin-bottom:-.5cqw}
.ptype{display:inline-block;pointer-events:auto;font-family:'Luckiest Guy',Impact,sans-serif;font-size:7.5cqw;line-height:1.05;color:#fff;-webkit-text-stroke:.44em var(--tc);paint-order:stroke fill;stroke-linejoin:round;padding:0 1cqw}
.ptype.keep{--tc:#1a5fd0}.ptype.discard{--tc:#d3281c}
.csel{outline:.55cqw dashed #ff9d00;outline-offset:.6cqw}
.cardstage.tm [data-ct]{cursor:move}
.cardstage{width:min(100%,340px);margin:0 auto;cursor:grab;touch-action:none;user-select:none}
/* modal */
#modal{position:fixed;inset:0;z-index:20;background:rgba(0,30,60,.55);display:none;place-items:center;padding:14px;overflow:auto}
#modal .mb{max-width:760px;width:100%;padding:18px;margin:auto;background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(225,242,252,.88))}
#mc{max-width:100%;max-height:56vh;width:auto;height:auto;touch-action:none;cursor:crosshair}
.exl{display:grid;gap:8px}.exi{text-align:left;border-radius:14px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);padding:10px 20px;z-index:30;display:none}
/* print sheets */
#printRoot{display:none}
.sheet{background:#fff;color:#000;position:relative;overflow:hidden;box-shadow:0 6px 20px rgba(0,0,0,.3);margin:0 auto 14px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sheet .row1{display:flex;gap:4mm;align-items:flex-start;margin-bottom:4mm}
.sheet .g3{display:flex;flex-wrap:wrap;gap:4mm}
.pc{outline:.25mm dashed #777;outline-offset:.6mm;flex:none}
.pc .stage{box-shadow:none;border-radius:0}
.pc .evo{box-shadow:none!important;border-radius:0!important}
.pc .cfig{width:100%;margin:0;background:#fff}
.x .stage,.x .evo,.x .pcard{box-shadow:none!important}
@media print{html,body{background:#fff!important}body::before{display:none}#app,#toast,#saved,#modal,#hdr{display:none!important}#printRoot{display:block}#printRoot .sheet{box-shadow:none;margin:0;break-after:page;page-break-after:always}#printRoot .sheet:last-child{break-after:auto;page-break-after:auto}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>

const $=(s,e=document)=>e.querySelector(s), $$=(s,e=document)=>[...e.querySelectorAll(s)], app=$('#app'), modal=$('#modal');

const dbOpen=()=>new Promise((res,rej)=>{const r=indexedDB.open('tokyoMonsterMaker',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const dbGet=k=>new Promise((res,rej)=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});
const dbPut=(k,v)=>new Promise((res,rej)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)});

const BOLT='<svg class="ic" viewBox="0 0 24 24"><path fill="#ffd400" stroke="#333" stroke-width="1.5" d="M13 2L4 14h6l-1 8 9-12h-6z"/></svg>';
const desc=s=>esc(s).replace(/\{(star|heart|energy|claw)\}/g,(m,k)=>sym(k)).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
const TEX=['metal','ocean','fire','ice','electric','wood','leaves','plain'];
const ICONS=['none','☣','☠','⚡','🔥','🦖','🐙','🤖','👽','🐲','🌀','🦆','🐰','🦀'];
const SW=['#ffffff','#ffd400','#ff4b3e','#3ec6ff','#7ee03a','#ff7ad9'];
const FONTS=['Luckiest Guy','Bangers','Bungee','Chewy','Creepster','Permanent Marker','Pacifico','Bubblegum Sans','Rubik Mono One','Press Start 2P'];

/* ---------- rendering helpers ---------- */
function dims(m,a){const r=m.r||a,z=m.z||1;if(m.contain)return r>=a?[z,z*a/r]:[z*r/a,z];return r>=a?[z*r/a,z]:[z,z*a/r]}
function imgH(m,a){if(!m||!m.src)return'<div class="ph">Upload an image to begin</div>';const[iw,ih]=dims(m,a);
return `<img alt="" src="${m.src}" style="width:${iw*100}%;height:${ih*100}%;left:${-(iw-1)*m.u*100}%;top:${-(ih-1)*m.v*100}%">`}
const txH=(t,on)=>`<span class="tx${on?' sel':''}" data-t="${t.id}" style="left:${t.x}%;top:${t.y}%;font-size:${t.s}cqw;color:${t.c};font-family:'${t.f}','Luckiest Guy',Impact,sans-serif;transform:translate(-50%,-50%) rotate(${t.rot||0}deg)">${esc(t.v)}${on?'<i class="rot"></i>':''}</span>`;
/* geometry in mm on the 120 x 92 mm health card. Windows: points top-left, health bottom-right, both 4 mm from the card edge. */
const WHEELS={points:{D:70,R:29,rin:22.5,n:21,bg:'#1f5fd0',edge:'#0c2f78',cx:33.5,wx:32.5,wy:8},health:{D:50,R:19.5,rin:14,n:13,bg:'#d4202e',edge:'#7a0f18',cx:96.5,wx:95.5,wy:84}};
for(const k in WHEELS){const w=WHEELS[k],dx=w.wx-w.cx,dy=Math.sqrt(w.R*w.R-dx*dx);w.cy=k==='points'?w.wy+dy:w.wy-dy;w.psi=Math.atan2(dx,k==='points'?dy:-dy)*180/Math.PI}
const HCW=120,WW=9,WHT=8,SQ=8,u=v=>(v*100/HCW).toFixed(3)+'cqw';
const HEART_W='<path fill="#fff" d="M12 21s-8-5.2-8-11a4.5 4.5 0 018-2.8A4.5 4.5 0 0120 10c0 5.8-8 11-8 11z"/>';
const sqBox=(x,y,bg,ic)=>`<div class="sq" style="left:${u(x)};top:${u(y)};width:${u(SQ)};height:${u(SQ)};background:${bg}"><svg viewBox="0 0 24 24">${ic}</svg></div>`;
const WIN=(()=>{const p=WHEELS.points,h=WHEELS.health;
return `<i class="hole2" style="left:${u(p.wx-WW/2)};top:${u(p.wy-WHT/2)};width:${u(WW)};height:${u(WHT)}"></i>${sqBox(p.wx-WW/2-SQ,p.wy-SQ/2,'#fff',IC.star)}
<i class="hole2" style="left:${u(h.wx-WW/2)};top:${u(h.wy-WHT/2)};width:${u(WW)};height:${u(WHT)}"></i>${sqBox(h.wx+WW/2,h.wy-SQ/2,'#d4202e',HEART_W)}
<i class="pin" style="left:${u(p.cx-1.2)};top:${u(p.cy-1.2)}"></i><i class="pin" style="left:${u(h.cx-1.2)};top:${u(h.cy-1.2)}"></i>`})();
function wheelSvg(k){const w=WHEELS[k],c=w.D/2,st=360/w.n,y=c-w.R,rm=(w.rin+c)/2;let g='';
for(let i=0;i<w.n;i++){let it;
if(k==='health'&&i===0)it=`<g transform="translate(${c} ${y}) scale(.3)"><path fill="#fff" d="M0-10C-8-10-11-5-11 0C-11 4-9 6-7 7.5L-7 10L7 10L7 7.5C9 6 11 4 11 0C11-5 8-10 0-10Z"/><circle cx="-4" cy="-1" r="3" fill="${w.bg}"/><circle cx="4" cy="-1" r="3" fill="${w.bg}"/><path fill="${w.bg}" d="M0 3L-1.6 6.2L1.6 6.2Z"/><path stroke="${w.bg}" stroke-width=".9" d="M-3 7.5V10M0 7.5V10M3 7.5V10"/></g>`;
else{const inv=k==='health'&&i>=11;it=(inv?`<rect x="${c-4}" y="${y-3.8}" width="8" height="7.6" rx="1.7" fill="#fff"/>`:'')+`<text x="${c}" y="${y}" text-anchor="middle" dominant-baseline="central" font-size="6.4" fill="${inv?w.bg:'#fff'}" style="font-family:'Luckiest Guy',Impact,sans-serif">${i}</text>`}
g+=`<g transform="rotate(${(i*st).toFixed(3)} ${c} ${c})"><g transform="rotate(${(-w.psi).toFixed(3)} ${c} ${y})">${it}</g></g>`}
return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w.D} ${w.D}" style="display:block;width:100%;height:100%"><circle cx="${c}" cy="${c}" r="${rm}" fill="#fff" stroke="${w.bg}" stroke-width="${c-w.rin}"/><circle cx="${c}" cy="${c}" r="${c-.2}" fill="none" stroke="${w.edge}" stroke-width=".4"/><circle cx="${c}" cy="${c}" r="${w.rin}" fill="none" stroke="${w.edge}" stroke-width=".3"/>${g}<circle cx="${c}" cy="${c}" r="1.3" fill="none" stroke="${w.bg}" stroke-width=".4"/></svg>`}
const wheelH=k=>`<div style="width:${WHEELS[k].D}mm;height:${WHEELS[k].D}mm;border-radius:50%">${wheelSvg(k)}</div>`;
const HCA=120/92;
const healthIn=(h,edit)=>imgH(h,HCA)+(h.texts||[]).map(t=>txH(t,edit&&mode==='text'&&t.id===sel)).join('')+WIN;
const hcH=h=>`<div class="stage c16" style="cursor:default">${healthIn(h,false)}</div>`;
const cardH=h=>`<div class="stage c16" style="cursor:pointer">${healthIn(h,false)}</div>`;
function evoFull(e,ch){const s=ch.style,len=(e.title||'').length,ts=cl(15-len*.34,7,13),dl=(e.desc||'').length,dsz=dl>300?3.5:dl>230?3.9:dl>170?4.3:dl>120?4.8:dl>80?5.3:5.9,cns=cl(11-ch.name.length*.35,4.5,8);
const custom=s.tex==='custom'&&s.texImg,texc=custom?'':(s.tex==='custom'?'plain':s.tex);
const evSt=`--bg:${s.bg};--ol:${s.ol}${custom?`;background-image:url('${s.texImg}');background-size:100% 100%;background-repeat:no-repeat`:''}`;
const ntSt=`--bg:${s.bg};--ol:${s.ol}${custom?`;background-image:url('${s.texImg}')`:''}`;
let none=s.icon==='none',badge=s.icon;
if(s.icon==='img'){if(s.badgeImg)badge=`<img src="${s.badgeImg}" alt="" style="width:100%;height:100%;object-fit:cover">`;else none=true}
else if(s.icon==='text'){const bt=(s.badgeText||'').trim();if(bt){const l=[...bt].length;badge=`<span class="otx" style="font-size:${l<=1?9:l===2?7:5.4}cqw;-webkit-text-stroke:.2em #000">${esc(bt)}</span>`}else none=true}
return `<div class="evw"><div class="evo ${texc}" style="${evSt}"><div class="ban${none?' nob':''}">${none?'':`<span class="med">${badge}</span>`}<span class="otx cn" style="font-size:${cns}cqw">${esc(ch.name.toUpperCase())}</span></div>
<div class="pan"><div class="otx ttl" style="font-size:${ts}cqw">${esc((e.title||'').toUpperCase())}</div><div class="ds" style="font-size:${dsz}cqw">${desc(e.desc)}</div></div>
<div class="notch ${texc}" style="${ntSt}"><div class="lab"><span class="y">${e.type==='perm'?'PERMANENT':'TEMPORARY'}</span> <span class="w">EVOLUTION</span></div></div></div></div>`}
function pcardH(c,edit){const T=c.tx,vis=(c.desc||'').replace(/\*\*/g,''),dl=vis.length,fs=(dl>110?4.8:dl>80?5.3:dl>50?5.8:6.4)*T.desc.s,ts=cl(21-(c.name||'').length*.55,10,19)*T.title.s,ty=c.type==='discard'?'discard':'keep';
const on=k=>edit&&cmode==='text'&&csel===k?' csel':'',tr=k=>`transform:translate(${T[k].dx}cqw,${T[k].dy}cqw) rotate(${T[k].rot}deg)`;
return `<div class="pw"><div class="pcard" style="--ol:${c.to}">${c.img&&c.img.src?`<div class="pimg">${imgH(c.img,5/7)}</div>`:'<div class="ph">Upload a photo</div>'}
<div class="pcost"><span class="otx" style="font-size:${c.cost>=10?9.5:11.5}cqw;color:#111;-webkit-text-stroke:0">${c.cost}</span>${BOLT}</div>
<div class="otx ptitle${on('title')}" data-ct="title" style="font-size:${ts}cqw;color:${c.tfill||'#ffffff'};font-family:'${c.tfont||'Luckiest Guy'}','Luckiest Guy',Impact,sans-serif;-webkit-text-stroke:${c.tw??.24}em var(--ol);${tr('title')}">${esc((c.name||'').toUpperCase())}</div>
<div class="pbox"><div class="ptypew"><span class="ptype ${ty}${on('type')}" data-ct="type" style="font-size:${7.5*T.type.s}cqw;${tr('type')}">${ty==='keep'?'KEEP':'DISCARD'}</span></div><div class="pdesc${on('desc')}" data-ct="desc" style="font-size:${fs}cqw;${tr('desc')}">${desc(c.desc)}</div></div></div></div>`}

/* ---------- views ---------- */
function home(){
const tabs=`<div class="blades"><button class="blade glass${view==='monsters'?' on':''}" data-act="view" data-v="monsters">Monster Maker</button><button class="blade glass${view==='cards'?' on':''}" data-act="view" data-v="cards">Power Cards</button></div>`;
return `${tabs}<div class="panel glass" id="mp"><div class="vwrap"><div class="vp${view==='monsters'?'':' off'}" data-v="monsters">${monGrid()}</div><div class="vp${view==='cards'?'':' off'}" data-v="cards">${cardGrid()}</div></div></div>
<div class="glass" style="margin:18px auto 0;padding:12px 16px;max-width:720px;text-align:center;border:2px solid #ffd400">If you don’t want to lose your data you need to download a backup. It’s supposed to save in your browser but sometimes it doesn’t.</div>
<p class="note home-note" style="text-align:center;margin-top:12px">Saved in this browser on this computer, so it works offline once the fonts have loaded. <button data-act="backup">Download a backup</button> <label class="btn">Restore backup<input type="file" accept=".json,application/json" hidden data-k="restore"></label></p>
<footer class="site-footer"><a href="https://github.com/pokedypokepoke" target="_blank" rel="noopener noreferrer">View my GitHub ↗</a></footer>
<p class="disc" style="opacity:.9;margin:6px 0 0">If you’re enjoying it, leaving a ★ rating on my GitHub would be awesome!</p>
<p class="disc">This site is not associated with or endorsed by King of Tokyo creator or any related entities.</p>`}
function syncHdr(){$$('#hdr .hn').forEach(b=>b.classList.toggle('on',b.dataset.nav===view))}
function switchView(v){if(v===view&&$('#mp'))return;view=v;syncHdr();const bl=$$('.blade[data-act=view]'),p=$('#mp');
if(!bl.length||!p){render();return}
bl.forEach(b=>b.classList.toggle('on',b.dataset.v===v));$$('.vp',p).forEach(x=>x.classList.toggle('off',x.dataset.v!==v))}
let fading=false;
function fadeTo(fn){if(fading)return fn();fading=true;app.style.transition='opacity .05s linear';app.style.opacity='0';
setTimeout(()=>{fn();app.style.transition='opacity .1s linear';requestAnimationFrame(()=>{app.style.opacity='1'});setTimeout(()=>{fading=false;app.style.transition='';app.style.opacity=''},110)},55)}
function goNav(v){if(!cur&&!curCard)return switchView(v);cur=null;curCard=null;view=v;save();fadeTo(render)}
const fmtDate=t=>t?new Date(t).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}):'';
function monGrid(){const n=S.chars.length;return `<p class="tiny">${n} monster${n===1?'':'s'} created</p><div class="grid">${S.chars.map(c=>`<div class="box glass" tabindex="0" data-act="open" data-id="${c.id}">${cardH(c.health)}<div class="bar"><b>${esc(c.name)}</b><span>${c.evos.length} evolutions</span></div><div class="tiny" style="text-align:left;margin:0 4px">Created ${fmtDate(c.created)}</div></div>`).join('')}
<div class="box glass new" tabindex="0" data-act="new"><i>+</i><b>Create new character</b></div></div>`}
function cardGrid(){const by={new:(a,b)=>b.created-a.created,cost:(a,b)=>a.cost-b.cost||a.name.localeCompare(b.name),az:(a,b)=>a.name.localeCompare(b.name)};
const list=[...S.cards].sort(by[sort]);const opt=[['new','Recently created'],['cost','Cheapest to Most Expensive'],['az','Alphabetical']];
return `<div class="row" style="margin-bottom:14px"><label class="f" style="flex-direction:row;align-items:center;gap:8px">Sort by <select data-f="sort" style="width:auto">${opt.map(o=>`<option value="${o[0]}"${sort===o[0]?' selected':''}>${o[1]}</option>`).join('')}</select></label>${S.cards.length?'<button data-act="expcards">Export all cards (.zip)</button><button data-act="printcards">Print cards…</button>':''}</div>
<div class="grid cgrid">${list.map(c=>`<div class="box glass" tabindex="0" data-act="opencard" data-id="${c.id}"><button class="xbtn" data-act="delcardmain" data-id="${c.id}" aria-label="Delete ${esc(c.name)}" title="Delete">×</button>${pcardH(c)}<div class="bar"><b>${esc(c.name)}</b><span>${c.cost}⚡</span></div><div class="tiny" style="text-align:left;margin:0 4px">Created ${fmtDate(c.created)}</div></div>`).join('')}
<div class="box glass new" tabindex="0" data-act="newcard"><i>+</i><b>Create new card</b></div></div>`}

function editor(){
const tabs=[['details','Summary'],['figure','Figure'],['health','Health card'],['evos','Evolutions'],['print','Print'],['printevo','Print evolutions']];
return `<div class="top"><button data-act="home">‹ All characters</button><input type="text" data-f="cname" aria-label="Character name" value="${esc(cur.name)}"></div>
<div class="blades">${tabs.map(t=>`<button class="blade glass${tab===t[0]?' on':''}" data-act="tab" data-t="${t[0]}">${t[1]}</button>`).join('')}<button class="blade glass" data-act="export">Export assets</button></div>
<div class="panel glass">${panel()}</div>`}
const upBtn=k=>`<label class="btn go">Upload image<input type="file" accept="image/*" hidden data-k="${k}"></label>`;
const symBtns=f=>`<div class="row">Insert ${['star','energy','heart','claw'].map(k=>`<button class="sw" style="width:38px;height:38px;border-radius:12px" aria-label="${k}" data-act="ins" data-k="${k}" data-for="${f}">${sym(k)}</button>`).join('')}</div>`;

function panel(){
if(tab==='details')return summary();
if(tab==='figure'){const f=cur.figure,o=f&&f.ol;return `<div class="split"><div><div class="tilt"><div class="stage cfig${f&&f.contain?' chk':''}" id="stage" data-k="figure"></div></div><div class="stand"></div></div>
<div class="ctl"><h2>Board figure</h2><p>This is the picture that goes in the stand on the board. Drag the image to position it.</p><div class="row">${upBtn('figure')}</div>
${f?`<div class="sp glass"><b>Crop</b><p class="note">Trim the edges of your image.</p><div class="row"><button class="go" data-act="cropfig">Crop image</button>${f.pre?'<button data-act="uncrop">Reset crop</button>':''}</div></div>
<div class="sp glass"><b>Remove the background</b><p class="note">Let the site do it for you, or trace around your figure yourself.</p><div class="row"><button class="go" data-act="cut" data-m="auto">Auto cut-out</button><button data-act="cut" data-m="manual">Draw it myself</button>${f.cut?'<button data-act="uncut">Use original</button>':''}</div></div>
<div class="sp glass"><label class="row"><input type="checkbox" data-f="fo-on" ${o.on?'checked':''}> <b>Thick outline</b> <span class="note">(after a cut-out)</span></label><div class="row" style="margin-top:8px">Colour <input type="color" data-f="fo-c" value="${o.c}"></div><label class="f" style="margin-top:8px">Thickness<input type="range" min="4" max="48" value="${o.w}" data-f="fo-w"></label></div>
<label class="f">Zoom<input type="range" min="${f.contain?.3:1}" max="3" step=".01" value="${f.z||1}" data-f="z" data-k="figure"></label>`:''}</div></div>`}
if(tab==='health'){const t=(cur.health.texts||[]).find(x=>x.id===sel);return `<div class="split"><div class="stage c16" id="stage" data-k="health"></div>
<div class="ctl"><h2>Health and point card</h2><div class="row">${upBtn('health')}<button class="chip${mode==='crop'?' on':''}" data-act="mode" data-m="crop">Crop image</button><button class="chip${mode==='text'?' on':''}" data-act="mode" data-m="text">Edit text</button></div>
${mode==='crop'?`<p class="note">Drag the card to position the image. The crop is fixed at the card shape (12 × 9.2 cm).</p><label class="f">Zoom<input type="range" min="1" max="3" step=".01" value="${cur.health.z}" data-f="z" data-k="health"></label>`
:`<div class="row"><button class="go" data-act="addtx">Add text</button>${t?'<button class="danger" data-act="deltx">Remove</button>':''}</div><p class="note">Drag text to move it, drag the yellow dot above it to rotate (snaps every 15°). Click text to edit it.</p>
<div class="ctl" id="txc" ${t?'':'style="opacity:.45;pointer-events:none"'}><label class="f">Text<input type="text" id="tv" data-f="tv" value="${esc(t?.v)}"></label>
<label class="f">Font<select id="tf" data-f="tf">${FONTS.map(f=>`<option value="${f}" style="font-family:'${f}'"${t&&t.f===f?' selected':''}>${f}</option>`).join('')}</select></label>
<label class="f">Size<input type="range" id="ts" min="4" max="24" step=".5" value="${t?.s||10}" data-f="ts"></label>
<label class="f">Rotation<input type="range" id="tr" min="-45" max="45" step="1" value="${t?.rot||0}" data-f="tr"></label>
<div class="row">Fill colour <input type="color" id="tc" data-f="tc" value="${t?.c||'#ffffff'}">${SW.map(c=>`<button class="sw" aria-label="${c}" style="background:${c}" data-act="swatch" data-c="${c}"></button>`).join('')}</div></div>`}</div></div>`}
if(tab==='print')return printPanel();
if(tab==='printevo')return evoPrintPanel();
return evoPanel()}


function summary(){const ia=cur.evos.filter(e=>e.inactive).length,p=cur.evos.filter(e=>!e.inactive&&e.type==='perm').length,t=cur.evos.length-p-ia,hasF=cur.figure&&cur.figure.src,hasH=!!cur.health.src;
const fig=hasF?`<div class="stage cfig" style="width:100%;cursor:default">${imgH(cur.figure,.75)}</div><div class="stand"></div>`:`<p class="note">No figure yet.</p>`;
const hc=hasH?hcH(cur.health):`<p class="note">No health card yet.</p>`;
return `<h2>${esc(cur.name)}</h2><p class="note">${p} permanent · ${t} temporary${ia?` · ${ia} inactive`:''}</p>
<div class="sumgrid"><div class="sum"><div class="row" style="justify-content:space-between"><h3>Board figure</h3><button data-act="tab" data-t="figure">${hasF?'Edit':'Add'}</button></div>${fig}</div>
<div class="sum"><div class="row" style="justify-content:space-between"><h3>Health card</h3><button data-act="tab" data-t="health">${hasH?'Edit':'Add'}</button></div><div class="tilt" style="width:60%">${hc}</div></div></div>
<div class="sum"><div class="row" style="justify-content:space-between"><h3>Evolutions</h3><button data-act="tab" data-t="evos">${cur.evos.length?'Edit':'Add'}</button></div><div>${thumbs('goevo')}</div></div>
<div class="row" style="margin-top:18px"><button class="danger" data-act="del">Delete this character</button></div>`}
function thumbs(act='pick'){const grp=(t,label)=>{const idx=cur.evos.map((x,i)=>i).filter(i=>{const e=cur.evos[i];return t==='inactive'?e.inactive:(!e.inactive&&(e.type==='perm')===(t==='perm'))});
if(t==='inactive'&&act!=='pick'&&!idx.length)return'';
return `<div class="evgrp"><h3>${label} <span class="note">· ${idx.length}</span></h3>${idx.length?`<div class="evlist">${idx.map(i=>`<div class="th${cur.evos[i].inactive?' inact':''}${act==='pick'&&i===evI?' on':''}" data-act="${act}" data-i="${i}">${evoFull(cur.evos[i],cur)}</div>`).join('')}</div>`:act==='pick'?'<p class="note">None yet</p>':''}</div>`};
return grp('perm','Permanent')+grp('temp','Temporary')+grp('inactive','Inactive')}
function evoPanel(){const e=cur.evos[evI],st=cur.style;
const head=`<h2>Evolutions</h2>`;
const bExtra=st.icon==='img'?`<div class="row" style="margin-top:8px">${st.badgeImg?`<img class="bimg" src="${st.badgeImg}" alt="">`:''}<label class="btn go">${st.badgeImg?'Replace badge image':'Upload badge image'}<input type="file" accept="image/*" hidden data-k="badge"></label></div>`
:st.icon==='text'?`<div class="row" style="margin-top:8px">Badge text <input type="text" data-f="s-badgeText" maxlength="3" placeholder="e.g. X2" style="width:110px" value="${esc(st.badgeText)}"></div>`:'';
const tExtra=st.tex==='custom'?`<div class="row" style="margin-top:8px">${st.texImg?`<img class="bimg" src="${st.texImg}" alt="" style="border-radius:8px">`:''}<label class="btn go">${st.texImg?'Replace texture image':'Upload texture image'}<input type="file" accept="image/*" hidden data-k="texture"></label><span class="note">Tinted by the background colour.</span></div>`:'';
const sp=`<div class="sp glass" style="margin-top:14px"><b>Deck style</b>
<div class="row" style="margin-top:8px">Badge <button class="chip${st.icon==='none'?' on':''}" data-act="sicon" data-v="none">None</button><button class="chip${st.icon==='img'?' on':''}" data-act="sicon" data-v="img">Custom image</button><button class="chip${st.icon==='text'?' on':''}" data-act="sicon" data-v="text">Text</button></div>${bExtra}
<div class="row" style="margin-top:8px">Background <input type="color" data-f="s-bg" value="${st.bg}"> Text outline <input type="color" data-f="s-ol" value="${st.ol}"></div>
<div class="row" style="margin-top:8px">Texture ${TEX.map(t=>`<button class="chip${st.tex===t?' on':''}" data-act="stex" data-v="${t}">${t}</button>`).join('')}<label class="btn chip${st.tex==='custom'?' on':''}">Upload texture image<input type="file" accept="image/*" hidden data-k="texture"></label></div></div>`;
const list=`${head}${sp}<div id="evgroups">${thumbs()}</div><div class="row"><button class="go" data-act="newevo">New evolution</button><button data-act="official">Official evolution examples</button><button data-act="mine">All my cards</button></div>`;

/* ---------- print ---------- */
const PR={};
const prOn=(ch,k)=>!(PR[ch.id]&&PR[ch.id][k]===false);
const prKeys=ch=>['hc',...(ch.figure&&ch.figure.src?['fig','figm']:[]),'pw','hw'];
const evKeys=ch=>ch.evos.map((e,i)=>e.inactive?null:'e'+i).filter(Boolean);
function packItems(items,g){const A=S.paper==='a4',W=A?210:215.9,H=A?297:279.4,m=8,uw=W-2*m,uh=H-1-2*m;
if(!items.length)return{n:0,html:'<p class="note" style="padding:20px">Nothing selected to print.</p>'};
const pages=[[]];let x=0,y=0,rh=0;
for(const it of items){if(x>0&&x+it.w>uw+.01){y+=rh+g;x=0;rh=0}if(y>0&&y+it.h>uh+.01){pages.push([]);x=0;y=0;rh=0}
pages[pages.length-1].push(it.html.replace('<div class="pc',`<div style="position:absolute;left:${m+x}mm;top:${m+y}mm"><div class="pc`)+'</div>');x+=it.w+g;rh=Math.max(rh,it.h)}
return{n:pages.length,html:pages.map(p=>`<div class="sheet" style="width:${W}mm;height:${H-1}mm">${p.join('')}</div>`).join('')}}
const PRC={},prcOn=id=>PRC[id]!==false;
const setPage=()=>{$('#pg').textContent='@page{size:'+(S.paper==='a4'?'A4':'letter')+';margin:0}'};
function sheetsCards(){return packItems(S.cards.filter(c=>prcOn(c.id)).map(c=>({w:63,h:88.2,html:`<div class="pc" style="width:63mm">${pcardH(c)}</div>`})),2)}
function cardPrintBody(){const r=sheetsCards();
return `<div class="mb glass" style="max-width:min(980px,96vw)"><div class="row" style="justify-content:space-between;margin-bottom:10px"><h2 style="margin:0">Print power cards</h2><button data-m="close">Close</button></div>
<div class="row"><label class="f" style="flex-direction:row;align-items:center;gap:8px">Paper <select data-mp="paper" style="width:auto"><option value="letter"${S.paper!=='a4'?' selected':''}>US Letter</option><option value="a4"${S.paper==='a4'?' selected':''}>A4</option></select></label><button class="go" data-m="cpprint"${r.n?'':' disabled'}>Print…</button><span class="pill gray">${r.n} page${r.n===1?'':'s'}</span></div>
<div class="sp glass" style="margin-top:12px"><b>Include in print</b><div class="row" style="margin-top:8px">${S.cards.map(c=>`<button class="chip${prcOn(c.id)?' on':''}" data-m="cpt" data-id="${c.id}">${prcOn(c.id)?'✓ ':''}${esc(c.name)}</button>`).join('')}</div>
<div class="row" style="margin-top:8px"><button data-m="cpall" data-v="on">Select all</button><button data-m="cpall" data-v="off">Select none</button></div></div>
<p class="note" style="margin-top:10px">In the print dialog, set scale to 100% (Actual size), margins to None, and turn on Background graphics. Power cards print at 63 × 88 mm.</p><div style="overflow-x:auto;margin-top:12px"><div style="zoom:.55">${r.html}</div></div></div>`}
function openCardPrint(){modal.style.display='grid';modal.innerHTML=cardPrintBody()}
function refreshCardPrint(){const sc=modal.scrollTop;modal.innerHTML=cardPrintBody();modal.scrollTop=sc}
/* strips: 0.2 mm (0.02 cm) narrower than the 9 mm card windows, one 8 mm cell per number */
const STRIP_W=WW-.2,STRIP_PAD=4,stripLen=k=>WHEELS[k].n*WHT+2*STRIP_PAD;
function stripSvg(k,hz){const w=WHEELS[k],L=stripLen(k),W=STRIP_W;let g='';
for(let i=0;i<w.n;i++){const y0=STRIP_PAD+i*WHT,cy=y0+WHT/2,inv=k==='health'&&i>=11;let it;
if(k==='health'&&i===0)it=`<g transform="translate(${W/2} ${cy}) scale(.34)"><path fill="#fff" d="M0-10C-8-10-11-5-11 0C-11 4-9 6-7 7.5L-7 10L7 10L7 7.5C9 6 11 4 11 0C11-5 8-10 0-10Z"/><circle cx="-4" cy="-1" r="3" fill="${w.bg}"/><circle cx="4" cy="-1" r="3" fill="${w.bg}"/><path fill="${w.bg}" d="M0 3L-1.6 6.2L1.6 6.2Z"/><path stroke="${w.bg}" stroke-width=".9" d="M-3 7.5V10M0 7.5V10M3 7.5V10"/></g>`;
else it=(inv?`<rect x="${W/2-4}" y="${cy-3.8}" width="8" height="7.6" rx="1.7" fill="#fff"/>`:'')+`<text x="${W/2}" y="${cy}" text-anchor="middle" dominant-baseline="central" font-size="6.4" fill="${inv?w.bg:'#fff'}" style="font-family:'Luckiest Guy',Impact,sans-serif">${i}</text>`;
g+=it+(i?`<line x1="0" x2="${W}" y1="${y0}" y2="${y0}" stroke="#fff" stroke-opacity=".55" stroke-width=".25"/>`:'')}
const inner=`<rect width="${W}" height="${L}" fill="${w.bg}"/>${g}<rect x=".15" y=".15" width="${W-.3}" height="${L-.3}" fill="none" stroke="${w.edge}" stroke-width=".3"/>`;
return hz?`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${L} ${W}" style="display:block;width:100%;height:100%"><g transform="translate(0 ${W}) rotate(-90)">${inner}</g></svg>`:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${L}" style="display:block;width:100%;height:100%">${inner}</svg>`}
const stripH=k=>`<div style="width:${stripLen(k)}mm;height:${STRIP_W}mm">${stripSvg(k,true)}</div>`;
const trk=()=>S.tracker==='wheel'?'wheel':'strip';

function sheets(ch){const fg=ch.figure&&ch.figure.src;
const items=[],on=k=>prOn(ch,k),wh=trk()==='wheel';
if(on('hc'))items.push({w:120,h:92,html:`<div class="pc" style="width:120mm">${hcH(ch.health)}</div>`});
if(fg&&on('fig'))items.push({w:67.5,h:90,html:`<div class="pc" style="width:67.5mm"><div class="stage cfig">${imgH(ch.figure,.75)}</div></div>`});
if(fg&&on('figm'))items.push({w:67.5,h:90,html:`<div class="pc" style="width:67.5mm"><div class="stage cfig" style="transform:scaleX(-1)">${imgH(ch.figure,.75)}</div></div>`});
if(on('hw'))items.push(wh?{w:50,h:50,html:`<div class="pc rd" style="width:50mm;height:50mm">${wheelH('health')}</div>`}:{w:stripLen('health'),h:STRIP_W,html:`<div class="pc" style="width:${stripLen('health')}mm;height:${STRIP_W}mm">${stripH('health')}</div>`});
if(on('pw'))items.push(wh?{w:70,h:70,html:`<div class="pc rd" style="width:70mm;height:70mm">${wheelH('points')}</div>`}:{w:stripLen('points'),h:STRIP_W,html:`<div class="pc" style="width:${stripLen('points')}mm;height:${STRIP_W}mm">${stripH('points')}</div>`});
return packItems(items,4)}
function printPanel(){return `<h2>Print</h2><div id="prb">${printBody()}</div>`}
function printBody(){const r=sheets(cur),ch=cur,wh=trk()==='wheel',t=(k,l)=>`<button class="chip${prOn(ch,k)?' on':''}" data-act="prt" data-k="${k}">${prOn(ch,k)?'✓ ':''}${l}</button>`,hasF=ch.figure&&ch.figure.src;
return `<div class="row"><label class="f" style="flex-direction:row;align-items:center;gap:8px">Paper <select data-f="paper" style="width:auto"><option value="letter"${S.paper!=='a4'?' selected':''}>US Letter</option><option value="a4"${S.paper==='a4'?' selected':''}>A4</option></select></label><label class="f" style="flex-direction:row;align-items:center;gap:8px">Points &amp; health tracker <select data-f="tracker" style="width:auto"><option value="strip"${!wh?' selected':''}>Sliders (paper strips)</option><option value="wheel"${wh?' selected':''}>Wheels</option></select></label><button class="go" data-act="doprint"${r.n?'':' disabled'}>Print…</button><span class="pill gray">${r.n} page${r.n===1?'':'s'}</span></div>
<div class="sp glass" style="margin-top:12px"><b>Include in print</b>
<div class="row" style="margin-top:8px">${t('hc','Health card')}${hasF?t('fig','Figure')+t('figm','Figure (mirrored)'):''}${t('pw',wh?'Points wheel':'Points slider')}${t('hw',wh?'Health wheel':'Health slider')}</div>
<div class="row" style="margin-top:8px"><button data-act="prall" data-v="on">Select all</button><button data-act="prall" data-v="off">Select none</button></div></div>
<p class="note" style="margin-top:10px">Evolution cards and their backs now live in the <b>Print evolutions</b> tab. In the print dialog, set scale to 100% (Actual size), margins to None, and turn on Background graphics. Health card 12×9.2 cm, figure 9 cm tall.${wh?' Wheels print at 7 cm and 5 cm.':` Sliders are ${STRIP_W} mm wide (0.2 mm narrower than the 9 mm card windows): points ${stripLen('points')/10} cm long, health ${stripLen('health')/10} cm long. They print lying flat to save paper, with the numbers turned so they read upright once you hold the strip vertically. Cut them out and thread them behind the card windows.`}</p><div style="overflow-x:auto;margin-top:12px"><div style="zoom:.55">${r.html}</div></div>`}
function doPrint(){const r=sheets(cur);if(!r.n)return toast('Pick something to print first.');setPage();$('#printRoot').innerHTML=r.html;setTimeout(()=>print(),150)}

const evSize=()=>cl(+S.evSize||70,25,190);
function evoBackH(ch){const bi=S.evBack||(S.evBackNone?null:EVBACK_DEFAULT);if(bi)return `<img alt="" src="${bi}" style="display:block;width:100%;height:100%;object-fit:cover">`;
const s=ch.style,custom=s.tex==='custom'&&s.texImg,texc=custom?'':(s.tex==='custom'?'plain':s.tex),l=(ch.name||'').length;
const st=`--bg:${s.bg};--ol:${s.ol}${custom?`;background-image:url('${s.texImg}');background-size:100% 100%;background-repeat:no-repeat`:''}`;
return `<div class="evw" style="width:100%"><div class="evo ${texc}" style="${st}"><div style="position:absolute;inset:0;display:grid;place-items:center;text-align:center"><div><div class="otx" style="font-size:${cl(16-l*.5,7,13)}cqw;padding:0 8cqw;word-break:break-word">${esc((ch.name||'').toUpperCase())}</div><div class="otx" style="font-size:7cqw;margin-top:2cqw;-webkit-text-stroke:.2em var(--ol)">EVOLUTION</div></div></div></div></div>`}
function evoPages(ch){const A=S.paper==='a4',W=A?210:215.9,H=(A?297:279.4)-1,m=8,g=3,uw=W-2*m,uh=H-2*m,sz=Math.min(evSize(),uw,uh);
const fr=S.evFront!==false,bk=S.evBackOn!==false,flip=S.evFlip==='short'?'short':'long';
const idx=evKeys(ch).filter(k=>prOn(ch,k)).map(k=>+k.slice(1));
if(!idx.length||(!fr&&!bk))return{n:0,print:'',preview:'<p class="note" style="padding:20px">Nothing selected to print.</p>'};
const per=Math.max(1,Math.floor((uw+g)/(sz+g))),rows=Math.max(1,Math.floor((uh+g)/(sz+g))),cap=per*rows,x0=(W-(per*sz+(per-1)*g))/2,y0=(H-(rows*sz+(rows-1)*g))/2;
const sh=h=>`<div class="sheet" style="width:${W}mm;height:${H}mm">${h}</div>`,out=[];
for(let p=0;p*cap<idx.length;p++){let f='',b='';
idx.slice(p*cap,p*cap+cap).forEach((ei,k)=>{const x=x0+(k%per)*(sz+g),y=y0+Math.floor(k/per)*(sz+g),bx=flip==='long'?W-x-sz:x,by=flip==='long'?y:H-y-sz;
f+=`<div style="position:absolute;left:${x.toFixed(2)}mm;top:${y.toFixed(2)}mm"><div class="pc" style="width:${sz}mm;height:${sz}mm">${evoFull(ch.evos[ei],ch)}</div></div>`;
b+=`<div style="position:absolute;left:${bx.toFixed(2)}mm;top:${by.toFixed(2)}mm"><div class="pc" style="width:${sz}mm;height:${sz}mm;outline:none">${evoBackH(ch)}</div></div>`});
if(fr)out.push({l:`Sheet ${p+1} · front (text side)`,h:sh(f)});if(bk)out.push({l:`Sheet ${p+1} · back`,h:sh(b)})}
return{n:out.length,print:out.map(o=>o.h).join(''),preview:out.map(o=>`<p class="note" style="text-align:center;margin:6px 0 2px">${o.l}</p>${o.h}`).join('')}}
function evoPrintPanel(){return `<h2>Print evolutions</h2><div id="prb2">${evoPrintBody()}</div>`}
function evoPrintBody(){const ch=cur,r=evoPages(ch),flip=S.evFlip==='short'?'short':'long',ks=evKeys(ch),nIn=ch.evos.filter(e=>e.inactive).length;
const t=(k,e,i)=>`<button class="chip${prOn(ch,k)?' on':''}" data-act="evprt" data-k="${k}">${prOn(ch,k)?'✓ ':''}${i+1}. ${esc((e.title||'Untitled').slice(0,22))} (${e.type==='perm'?'perm':'temp'})</button>`;
return `<div class="row"><label class="f" style="flex-direction:row;align-items:center;gap:8px">Paper <select data-f="paper" style="width:auto"><option value="letter"${S.paper!=='a4'?' selected':''}>US Letter</option><option value="a4"${S.paper==='a4'?' selected':''}>A4</option></select></label><button class="go" data-act="doprintevo"${r.n?'':' disabled'}>Print…</button><span class="pill gray" id="evn">${r.n} page${r.n===1?'':'s'}</span></div>
<div class="sp glass" style="margin-top:12px"><div class="row"><label class="row"><input type="checkbox" data-f="evfront"${S.evFront!==false?' checked':''}> <b>Evolution cards (text side)</b></label><label class="row"><input type="checkbox" data-f="evbackon"${S.evBackOn!==false?' checked':''}> <b>Card backs</b></label></div>
<label class="f" style="margin-top:10px">Card size: <b id="evszv">${evSize()} mm</b> (${(evSize()/10).toFixed(1)} cm square)<input type="range" min="40" max="100" step="1" value="${evSize()}" data-f="evsize"></label>
<div class="row" style="margin-top:10px"><label class="f" style="flex-direction:row;align-items:center;gap:8px">Double-sided flip <select data-f="evflip" style="width:auto"><option value="long"${flip==='long'?' selected':''}>Long edge (standard)</option><option value="short"${flip==='short'?' selected':''}>Short edge</option></select></label></div></div>
<div class="sp glass" style="margin-top:12px"><b>Back image</b><p class="note" style="margin:6px 0 8px">${S.evBack?'Your uploaded image is the back of every evolution card.':S.evBackNone?'Using a back generated from this character’s deck style.':'Using the King of Tokyo back by default.'} Images are cropped to fill a square.</p><div class="row"><img class="bimg" src="${S.evBack||EVBACK_DEFAULT}" alt="" style="border-radius:8px;display:${S.evBackNone&&!S.evBack?'none':'inline'}"><label class="btn go">${S.evBack?'Replace back image':'Upload your own back'}<input type="file" accept="image/*" hidden data-k="evback"></label>${S.evBack?'<button data-act="evbackclear">Use default</button>':''}<button data-act="evbackgen">${S.evBackNone&&!S.evBack?'Use King of Tokyo back':'Use generated deck-style back'}</button></div></div>
<div class="sp glass" style="margin-top:12px"><b>Include in print</b>${ks.length?`<div class="row" style="margin-top:8px">${ks.map(k=>t(k,ch.evos[+k.slice(1)],+k.slice(1))).join('')}</div><div class="row" style="margin-top:8px"><button data-act="evprall" data-v="on">Select all</button><button data-act="evprall" data-v="off">Select none</button></div>`:'<p class="note" style="margin-top:8px">No active evolutions yet.</p>'}${nIn?`<p class="note" style="margin:8px 0 0">${nIn} inactive card${nIn===1?' is':'s are'} never printed.</p>`:''}</div>
<p class="note" style="margin-top:10px">Print double-sided and flip on the <b>${flip==='long'?'long':'short'} edge</b>. Each back sits exactly behind its front and stays right side up. Sheets print in order: front, then its back. In the print dialog set scale to 100% (Actual size), margins to None, and turn on Background graphics.</p><div style="overflow-x:auto;margin-top:12px"><div style="zoom:.55" id="evprev">${r.preview}</div></div>`}
function refreshEvoPrev(){const r=evoPages(cur),p=$('#evprev'),n=$('#evn');if(p)p.innerHTML=r.preview;if(n)n.textContent=r.n+' page'+(r.n===1?'':'s');const b=$('[data-act=doprintevo]');if(b)b.disabled=!r.n}
function doPrintEvo(){const r=evoPages(cur);if(!r.n)return toast('Pick something to print first.');setPage();$('#printRoot').innerHTML=r.print;setTimeout(()=>print(),150)}
addEventListener('beforeprint',()=>{if(cur&&tab==='print')$('#printRoot').innerHTML=sheets(cur).html;else if(cur&&tab==='printevo')$('#printRoot').innerHTML=evoPages(cur).print});

:`<div class="sp glass"><div class="row">${['title','desc'].map(k=>`<button class="chip${csel===k?' on':''}" data-act="csel" data-k="${k}">${names[k]}</button>`).join('')}</div>

${csel==='type'?'':`<label class="f">Size<input type="range" min=".6" max="1.5" step=".05" value="${T.s}" data-f="ct-s"></label>

<div class="row">Card type <button class="chip${c.type!=='discard'?' on':''}" data-act="ctype" data-v="keep">Keep</button><button class="chip${c.type==='discard'?' on':''}" data-act="ctype" data-v="discard">Discard</button></div>
<label class="f">Energy cost: <b id="costv">${c.cost}</b><input type="range" min="0" max="20" step="1" value="${c.cost}" data-f="c-cost"></label>
${mid}
<label class="f">Description<textarea rows="4" id="ed" data-f="c-desc">${esc(c.desc)}</textarea></label><div class="row">Insert ${['star','energy','heart','claw'].map(k=>`<button class="sw" style="width:38px;height:38px;border-radius:12px" aria-label="${k}" data-act="ins" data-k="${k}" data-for="card">${sym(k)}</button>`).join('')}<button style="width:38px;height:38px;padding:0;border-radius:12px;font-weight:900" data-act="bold" title="Bold the selected text (Ctrl+B)" aria-label="Bold">B</button></div>

if(f&&f.src)it.push({n:`${ch.name} - figure.png`,label:'Board figure (9 cm tall)',get:()=>exactPng(`<div class="stage cfig" style="width:100%;margin:0;background:transparent;box-shadow:none;border-radius:0">${imgH(f,.75)}</div>`,67.5,90)});
if(f&&f.src)it.push({n:`${ch.name} - figure mirrored.png`,label:'Board figure, mirrored (9 cm tall)',get:()=>exactPng(`<div class="stage cfig" style="width:100%;margin:0;background:transparent;box-shadow:none;border-radius:0;transform:scaleX(-1)">${imgH(f,.75)}</div>`,67.5,90)});
it.push({n:`${ch.name} - points wheel.png`,label:'Points wheel (7 cm)',get:()=>exactPng(wheelSvg('points'),70,70)},{n:`${ch.name} - health wheel.png`,label:'Health wheel (5 cm)',get:()=>exactPng(wheelSvg('health'),50,50)});
it.push({n:`${ch.name} - points slider.png`,label:`Points slider (${STRIP_W} × ${stripLen('points')} mm)`,get:()=>exactPng(stripSvg('points'),STRIP_W,stripLen('points'))},{n:`${ch.name} - health slider.png`,label:`Health slider (${STRIP_W} × ${stripLen('health')} mm)`,get:()=>exactPng(stripSvg('health'),STRIP_W,stripLen('health'))},{n:`${ch.name} - evolution back.png`,label:`Evolution card back (${evSize()/10} cm)`,get:()=>exactPng(evoBackH(ch),evSize(),evSize())});
ch.evos.forEach((e,i)=>it.push({n:`${ch.name} - evolution ${i+1} - ${e.title}.png`,label:`Evolution ${i+1}: ${e.title} (7 × 7 cm)`,get:()=>exactPng(evoFull(e,ch),70,70)}));return it}
const cardPng=c=>toPng(`<div style="width:300px">${pcardH(c)}</div>`,300,420,2.5);
function openExport(items,zname,title){EX=items;EXZ=zname;modal.style.display='grid';
modal.innerHTML=`<div class="mb glass"><h2>${esc(title)}</h2><p class="note">Click an item to download it as a PNG, or export everything at once. Sizes are exact at 300 dpi, so they print at real size.</p><div class="row" style="margin-bottom:12px"><button class="go" data-m="zipall">Export all (.zip)</button><button data-m="close">Close</button></div><div class="exl">${items.map((x,i)=>`<button class="exi" data-m="dl" data-i="${i}">⬇ ${esc(x.label)}</button>`).join('')||'<p>Nothing to export yet.</p>'}</div></div>`}
async function zipAll(){toast('Building zip…');try{const files=[];for(const [i,it] of EX.entries()){const b=await it.get();files.push({name:String(i+1).padStart(2,'0')+' '+safe(it.n),data:new Uint8Array(await b.arrayBuffer())})}dl(zip(files),safe(EXZ)+'.zip');toast('Exported to your downloads.')}catch(e){toast('Export failed. Try Chrome or Edge.')}}

if(a==='close')return closeModal();
if(a==='mode'){M.mode=b.dataset.v;M.pts=[];M.closed=false;return showCut()}
if(a==='undo'){M.pts.pop();M.closed=false;return mDraw()}
if(a==='clear'){M.pts=[];M.closed=false;return mDraw()}

if(a==='useoff'){const o=OFFICIAL[+b.dataset.i];closeModal();cur.evos.push({type:o[2]==='Temporary'?'temp':'perm',title:o[1],desc:o[3]});evI=cur.evos.length-1;tab='evos';render();toast('Added. Edit it however you like.');return}
if(a==='cropapply')return applyCrop();

if(a==='addmine'){const c=S.chars.find(x=>x.id===b.dataset.c),e=c&&c.evos[+b.dataset.i];if(!e)return;const sc=modal.scrollTop;cur.evos.push({type:e.type,title:e.title,desc:e.desc,inactive:false});evI=cur.evos.length-1;tab='evos';render();modal.innerHTML=mineBody();modal.scrollTop=sc;toast('Added to '+cur.name+'.');return}

if(k==='evback'){const bm=await load(f.files[0],1400);S.evBack=bm.src;S.evBackNone=false;save();const pb=$('#prb2');if(pb)pb.innerHTML=evoPrintBody();return}
if(k==='badge'){const bm=await load(f.files[0],300);cur.style.badgeImg=bm.src;cur.style.icon='img';save();render();return}
if(k==='texture'){cur.style.texImg=await loadSquare(f.files[0],700);cur.style.tex='custom';save();render();return}
const m=await load(f.files[0],k==='health'?1400:1000);
if(k==='figure')cur.figure={orig:m.src,src:m.src,r:m.r,z:1,u:.5,v:.5,contain:false,cut:null,ol:{on:true,c:'#ffffff',w:14}};
else if(k==='card')curCard.img=m;
else{const t=cur.health.texts;Object.assign(cur.health,m);if(!t.length)cur.health.texts=[{id:'t1',v:cur.name,x:50,y:86,s:10,c:'#ffffff',f:'Luckiest Guy',rot:0}]}
save();render()});
app.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.box')){e.preventDefault();e.target.click()}});
app.addEventListener('click',async e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,d=b.dataset,E=cur&&cur.evos[evI];
if(a==='view')return switchView(d.v);
if(a==='new'){cur={id:uid(),created:Date.now(),name:'New Monster',figure:null,health:{src:null,r:1.6,z:1,u:.5,v:.5,texts:[]},evos:[]};fix(cur);S.chars.push(cur);tab='details';evI=0;sel=null;return fadeTo(render)}
if(a==='open'){cur=S.chars.find(c=>c.id===d.id);tab='details';evI=0;sel=null;return fadeTo(render)}
if(a==='home'){cur=null;curCard=null;save();return fadeTo(render)}
if(a==='del'){if(confirm('Delete '+cur.name+' and all of its evolutions?')){S.chars=S.chars.filter(c=>c!==cur);cur=null;save();render()}return}
if(a==='tab'){if(d.t===tab)return;tab=d.t;$$('.blade[data-act=tab]').forEach(x=>x.classList.toggle('on',x.dataset.t===tab));const p=$('.panel');p.style.opacity=0;setTimeout(()=>{p.innerHTML=panel();paint();p.style.opacity=1},50);return}
if(a==='mode'){mode=d.m;sel=null;return render()}
if(a==='addtx'){const t={id:'t'+Date.now(),v:'Text',x:50,y:50,s:10,c:'#ffffff',f:'Luckiest Guy',rot:0};cur.health.texts.push(t);sel=t.id;return render()}
if(a==='deltx'){cur.health.texts=cur.health.texts.filter(t=>t.id!==sel);sel=null;return render()}
if(a==='swatch'){const t=cur.health.texts.find(t=>t.id===sel);if(t){t.c=d.c;$('#tc').value=d.c;paint()}return}
if(a==='cut')return openCut(d.m);
if(a==='uncut'){cur.figure.cut=null;cur.figure.z=1;await rebuildFig(cur.figure);return render()}
if(a==='delmon'){const c=S.chars.find(x=>x.id===d.id);if(c&&confirm('Delete '+c.name+' and all of its evolutions?')){S.chars=S.chars.filter(x=>x!==c);save();render()}return}
if(a==='delcardmain'){const c=S.cards.find(x=>x.id===d.id);if(c&&confirm('Delete '+c.name+'?')){S.cards=S.cards.filter(x=>x!==c);save();render()}return}
if(a==='goevo'){tab='evos';evI=+d.i;return render()}
if(a==='official')return openOfficial();
if(a==='printcards')return openCardPrint();
if(a==='mine')return openMine();
if(a==='cropfig')return openCrop();
if(a==='uncrop'){const f=cur.figure;f.orig=f.pre.orig;f.cut=f.pre.cut;f.pre=null;f.z=1;f.u=.5;f.v=.5;await rebuildFig(f);save();return render()}
if(a==='newevo'){cur.evos.push(newEvo());evI=cur.evos.length-1;return render()}
if(a==='pick'){evI=+d.i;return render()}
if(a==='dupevo'){cur.evos.splice(evI+1,0,{...E});evI++;return render()}
if(a==='delevo'){cur.evos.splice(evI,1);evI=Math.max(0,evI-1);return render()}
if(a==='etype'){if(d.v==='inactive')E.inactive=true;else{E.type=d.v;E.inactive=false}return render()}
if(a==='sicon'){cur.style.icon=d.v;return render()}
if(a==='stex'){cur.style.tex=d.v;return render()}
if(a==='ins'){const ta=$('#ed'),tg=d.for==='card'?curCard:E,p=ta.selectionStart,tok='{'+d.k+'}';ta.value=ta.value.slice(0,p)+tok+ta.value.slice(ta.selectionEnd);tg.desc=ta.value;ta.focus();ta.setSelectionRange(p+tok.length,p+tok.length);return paint()}
if(a==='export')return openExport(exportItems(cur),cur.name+' - assets',`Export assets for ${cur.name}`);
if(a==='doprint')return doPrint();
if(a==='doprintevo')return doPrintEvo();
if(a==='evprt'){const o=PR[cur.id]=PR[cur.id]||{};o[d.k]=!prOn(cur,d.k);$('#prb2').innerHTML=evoPrintBody();return}
if(a==='evprall'){const o=PR[cur.id]=PR[cur.id]||{};evKeys(cur).forEach(k=>o[k]=d.v==='on');$('#prb2').innerHTML=evoPrintBody();return}
if(a==='evbackgen'){S.evBack=null;S.evBackNone=!S.evBackNone;save();$('#prb2').innerHTML=evoPrintBody();return}
if(a==='evbackclear'){S.evBack=null;S.evBackNone=false;save();$('#prb2').innerHTML=evoPrintBody();return}
if(a==='prt'){const o=PR[cur.id]=PR[cur.id]||{};o[d.k]=!prOn(cur,d.k);$('#prb').innerHTML=printBody();return}
if(a==='prall'){const o=PR[cur.id]=PR[cur.id]||{};prKeys(cur).forEach(k=>o[k]=d.v==='on');$('#prb').innerHTML=printBody();return}
if(a==='newcard'){cmode='crop';csel='title';curCard=fixCard({name:'New Card',cost:3,type:'keep',desc:'Gain 2 {star}.',img:null});S.cards.push(curCard);return fadeTo(render)}
if(a==='opencard'){cmode='crop';csel='title';curCard=S.cards.find(c=>c.id===d.id);return fadeTo(render)}
if(a==='cmode'){cmode=d.m;return render()}
if(a==='csel'){csel=d.k;return render()}
if(a==='ctype'){curCard.type=d.v;return render()}
if(a==='ctreset'){curCard.tx[csel]={...TXD[csel]};return render()}
if(a==='bold')return boldSel();
if(a==='dupcard'){const c=fixCard({...JSON.parse(JSON.stringify(curCard)),id:null,created:Date.now(),name:curCard.name+' copy'});S.cards.push(c);curCard=c;return render()}
if(a==='delcard'){if(confirm('Delete '+curCard.name+'?')){S.cards=S.cards.filter(c=>c!==curCard);curCard=null;save();render()}return}
if(a==='expcards')return openExport(S.cards.map(c=>({n:`${c.name}.png`,label:`${c.name} (${c.cost}⚡)`,get:()=>cardPng(c)})),'Power cards','Export power cards');
if(a==='backup')return dl(new Blob([JSON.stringify(S)],{type:'application/json'}),'tokyo-monster-maker-backup.json')});

app.addEventListener('input',e=>{const t=e.target,f=t.dataset.f;if(!f)return;const v=t.value,k=t.dataset.k;
if(f==='sort'){sort=v;return render()}
if(f==='paper'){S.paper=v;save();setPage();if(tab==='printevo')$('#prb2').innerHTML=evoPrintBody();else $('#prb').innerHTML=printBody();return}
if(f==='tracker'){S.tracker=v;save();$('#prb').innerHTML=printBody();return}
if(f==='evsize'){S.evSize=+v;save();const z=$('#evszv');if(z)z.textContent=evSize()+' mm';return refreshEvoPrev()}
if(f==='evfront'||f==='evbackon'){S[f==='evfront'?'evFront':'evBackOn']=t.checked;save();$('#prb2').innerHTML=evoPrintBody();return}
if(f==='evflip'){S.evFlip=v;save();$('#prb2').innerHTML=evoPrintBody();return}
if(f==='cname'){cur.name=v;return save()}
if(f==='z'){const m=k==='figure'?cur.figure:k==='card'?curCard.img:cur.health;if(m)m.z=+v;return paint()}
if(f==='ct-s'||f==='ct-r'){const t=curCard.tx[csel];if(f==='ct-s')t.s=+v;else t.rot=+v;return paint()}
if(f.startsWith('c-')){const p=f.slice(2);curCard[p]=(p==='cost'||p==='tw')?+v:v;if(p==='cost')$('#costv').textContent=v;return paint()}
if(f.startsWith('fo-')){const o=cur.figure.ol;if(f==='fo-on')o.on=t.checked;if(f==='fo-c')o.c=v;if(f==='fo-w')o.w=+v;return figChanged()}
if(f.startsWith('s-')){cur.style[f.slice(2)]=v;return paint()}
if(f.startsWith('e-')){cur.evos[evI][f.slice(2)]=v;return paint()}
if(f[0]==='t'){const x=cur.health.texts.find(x=>x.id===sel);if(!x)return;if(f==='tv')x.v=v;if(f==='ts')x.s=+v;if(f==='tc')x.c=v;if(f==='tf')x.f=v;if(f==='tr')x.rot=+v;paint()}});

$('#hdr').addEventListener('click',e=>{const b=e.target.closest('[data-nav]');if(b)goNav(b.dataset.nav)});
const calm=matchMedia('(prefers-reduced-motion: reduce)').matches;
function tiltOf(t){let h;if(h=t.closest('.grid .box:not(.new)'))return[h,$('.pw,.stage',h)];if(h=t.closest('.th'))return[h,$('.evw',h)];if(h=t.closest('.mcard'))return[h,$('.evw',h)];if(h=t.closest('.tilt'))return[h,h];return[null,null]}
function tiltMove(e){if(e.pointerType==='touch'||drag)return;const[h,w]=tiltOf(e.target);if(!w)return;
const r=w.getBoundingClientRect(),x=cl((e.clientX-r.left)/r.width-.5,-.5,.5),y=cl((e.clientY-r.top)/r.height-.5,-.5,.5);w.style.transition='transform .12s ease-out';w.style.transform=`perspective(800px) rotateY(${x*18}deg) rotateX(${-y*18}deg)`}
function tiltOut(e){const[h,w]=tiltOf(e.target);if(h&&w&&!h.contains(e.relatedTarget))w.style.transform=''}
app.addEventListener('pointermove',tiltMove);app.addEventListener('pointerout',tiltOut);
modal.addEventListener('pointermove',tiltMove);modal.addEventListener('pointerout',tiltOut);
/* dragging: pan the crop, move text, rotate text */
app.addEventListener('pointerdown',e=>{const st=e.target.closest('#stage');if(!st)return;const k=st.dataset.k,r=st.getBoundingClientRect();
if(k==='health'&&mode==='text'){const el=e.target.closest('[data-t]');if(!el){if(sel){sel=null;render()}return}
const t=cur.health.texts.find(x=>x.id===el.dataset.t);if(!t)return;
if(e.target.closest('.rot')){const b=el.getBoundingClientRect();drag={k:'r',t,cx:b.left+b.width/2,cy:b.top+b.height/2};e.preventDefault();return}
const changed=sel!==t.id;sel=t.id;drag={k:'t',t,r,ox:(e.clientX-r.left)/r.width*100-t.x,oy:(e.clientY-r.top)/r.height*100-t.y};if(changed)render();e.preventDefault();return}
if(k==='health'&&mode==='text')return;
if(k==='card'&&cmode==='text'){const el=e.target.closest('[data-ct]');if(!el)return;const key=el.dataset.ct,t=curCard.tx[key],ch=csel!==key;csel=key;const pc=$('.pcard',st);
drag={k:'ct',t,x:e.clientX,y:e.clientY,dx:t.dx,dy:t.dy,u:pc.clientWidth/100};if(ch)render();e.preventDefault();return}
const m=k==='figure'?cur.figure:k==='card'?curCard.img:cur.health;if(!m||!m.src)return;
drag={k:'c',m,a:k==='figure'?.75:k==='card'?5/7:HCA,r,x:e.clientX,y:e.clientY,u:m.u,v:m.v};e.preventDefault()});
addEventListener('pointermove',e=>{if(!drag)return;
if(drag.k==='r'){let a=Math.atan2(e.clientY-drag.cy,e.clientX-drag.cx)*180/Math.PI+90;a=((a+180)%360+360)%360-180;const s=Math.round(a/15)*15;if(Math.abs(a-s)<4)a=s;drag.t.rot=cl(Math.round(a),-45,45)}
else if(drag.k==='t'){const r=drag.r;drag.t.x=cl((e.clientX-r.left)/r.width*100-drag.ox,0,100);drag.t.y=cl((e.clientY-r.top)/r.height*100-drag.oy,0,100)}
else if(drag.k==='ct'){const t=drag.t;t.dx=cl(drag.dx+(e.clientX-drag.x)/drag.u,-70,70);t.dy=cl(drag.dy+(e.clientY-drag.y)/drag.u,-70,70)}
else{const r=drag.r,[iw,ih]=dims(drag.m,drag.a);if(Math.abs(iw-1)>.001)drag.m.u=cl(drag.u-(e.clientX-drag.x)/(r.width*(iw-1)),0,1);if(Math.abs(ih-1)>.001)drag.m.v=cl(drag.v-(e.clientY-drag.y)/(r.height*(ih-1)),0,1)}
paint()});
addEventListener('pointerup',()=>{if(drag&&(drag.k==='t'||drag.k==='r'))syncTx();drag=null});
function syncTx(){const t=(cur&&cur.health.texts||[]).find(t=>t.id===sel),c=$('#txc');if(!c||!t)return;c.style.opacity=1;c.style.pointerEvents='auto';$('#tv').value=t.v;$('#ts').value=t.s;$('#tc').value=t.c;$('#tf').value=t.f;$('#tr').value=t.rot||0}

/* ---------- start ---------- */
(async()=>{let ok=true;
try{db=await dbOpen();const s=await dbGet('state');if(s)S=s;else{try{const o=JSON.parse(localStorage.getItem('kotMonsters')||'null');if(o&&o.chars)S=o}catch(e){}}}
catch(e){db=null;try{const o=JSON.parse(localStorage.getItem('kotMonsters2')||'null');if(o)S=o}catch(x){ok=false}}
S.chars=S.chars||[];S.cards=S.cards||[];S.paper=S.paper||'letter';S.chars.forEach(fix);S.cards.forEach(fixCard);
setSaved(ok?'ok':'err');render()})();
